    - name: JDK 25 — proven V9 toolchain
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v4
    - name: 03 - Kotlin compilation is mandatory
      shell: bash
      run: 'set -euo pipefail

        chmod +x ./gradlew

        ./gradlew -Powntv.corePath="$GITHUB_WORKSPACE/moviotv-core" :app:compileStandardDebugKotlin --no-daemon --stacktrace

        '
    - name: 04 - Android lint + JVM unit tests + APK assembly are mandatory
      shell: bash
      run: 'set -euo pipefail

        ./gradlew -Powntv.corePath="$GITHUB_WORKSPACE/moviotv-core" lintStandardDebug testStandardDebugUnitTest assembleStandardDebug
        --no-daemon --stacktrace

        '
    - name: 05 - APK signature, version and package verification
      shell: bash
      run: 'set -euo pipefail

        apk=app/build/outputs/apk/standard/debug/app-standard-debug.apk

        test -s "$apk"

        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

        aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -n 1)"

        signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

        test -x "$aapt" && test -x "$signer"

        "$signer" verify "$apk"

        "$aapt" dump badging "$apk" > /tmp/moviotv-v91-badging.txt

        grep -F "name=''com.oakstudios.moviotv''" /tmp/moviotv-v91-badging.txt

        grep -F "versionCode=''100203''" /tmp/moviotv-v91-badging.txt

        grep -F "versionName=''9.1.0-qa3''" /tmp/moviotv-v91-badging.txt

        mkdir -p dist

        cp "$apk" dist/MovioTV-v9.1.0-HANDOVER-FIX1-QA-debug.apk

        sha256sum dist/*.apk > dist/SHA256SUMS.txt

        '
    - name: Upload V9.1 handover QA APK (not production release)
      uses: actions/upload-artifact@v4
      with:
        name: MovioTV-V9.1-HANDOVER-FIX1-QA-DEBUG
        path: 'dist/MovioTV-v9.1.0-HANDOVER-FIX1-QA-debug.apk

          dist/SHA256SUMS.txt'
        retention-days: 30
        if-no-files-found: error
    - name: Collect build failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: MovioTV-V9.1-BUILD-FAILURE-DIAGNOSTICS
        path: 'app/build/reports/tests/**

          app/build/reports/lint-results-*.html

          app/build/reports/lint-results-*.txt

          build/reports/problems/**'
        retention-days: 30
        if-no-files-found: warn
