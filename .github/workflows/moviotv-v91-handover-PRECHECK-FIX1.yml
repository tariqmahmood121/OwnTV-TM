name: MovioTV V9.1 — Smart Handover QA (Precompiler FIX1)
run-name: 'MovioTV V9.1 Smart Handover FIX1 — ${{ github.ref_name }} #${{ github.run_number }}'
'on':
  push:
    branches:
    - moviotv-v9
    paths:
    - .github/workflows/moviotv-v91-handover-PRECHECK-FIX1.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: moviotv-v91-handover-fix1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  v91-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      VERSION_NAME: 9.1.0-qa3
      VERSION_CODE: '100203'
    steps:
    - name: Checkout V9 verified source
      uses: actions/checkout@v4
      with:
        ref: moviotv-v9
        fetch-depth: 0
    - name: Checkout pinned core used by successful V9
      uses: actions/checkout@v4
      with:
        repository: ahXN00/OwnTV_Core
        ref: 0b60ef6d25e03a24193f1a5680cb239816fd8625
        path: moviotv-core
        persist-credentials: false
    - name: Checkout pinned V8.1 patch used by successful V9
      uses: actions/checkout@v4
      with:
        repository: tariqmahmood121/OwnTV-TM
        ref: feature/moviotv-v81-stability
        path: moviotv-v81-verified
        persist-credentials: false
    - name: 01 - Reproduce last successful V9 source and patches
      shell: bash
      run: "set -euo pipefail\npython3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'\npython3 - <<'PY_BASE'\n\
        from pathlib import Path\nimport subprocess\nimport yaml\nsource=Path('.github/workflows/moviotv-v9-qa-REPAIR2.yml')\n\
        assert source.is_file(), 'The verified V9 QA workflow is missing'\nparsed=yaml.safe_load(source.read_text(encoding='utf-8'))\n\
        steps=parsed['jobs']['v9-qa']['steps']\nfor name in ('01 - Replay V8.4.3 source checks', '02 - Apply V9 UI and wizard\
        \ feature patch'):\n    found=[s for s in steps if s.get('name') == name and 'run' in s]\n    assert len(found) ==\
        \ 1, f'Expected precisely one verified baseline step: {name}'\n    print('V9 REPLAY:',name,flush=True)\n    subprocess.run(['bash','-e','-u','-o','pipefail','-c',found[0]['run']],\
        \ check=True)\nprint('V9 verified baseline replay completed',flush=True)\nPY_BASE\n"
    - name: 02 - Apply existing V9.1 recovery and responsive source patch
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/moviotv_v91_patch.py <<'PY_V91'\n#!/usr/bin/env python3\n\"\"\"MovioTV V9.1 development\
        \ QA patch; replays on V9 generated source tree.\n\nIntentional limitations: no fake Force Close. Central must provide\
        \ authenticated\nremote-stop delivery and acknowledgement before the app can expose that action.\n\"\"\"\nfrom pathlib\
        \ import Path\nimport re\nimport xml.etree.ElementTree as ET\n\nBASE = Path('app/src/main/java/tv/own/owntv')\nRES\
        \ = Path('app/src/main/res')\nassert BASE.is_dir(), 'Expected V9 source generated by verified recipe'\n\ndef once(path:\
        \ Path, before: str, after: str) -> None:\n    s = path.read_text(encoding='utf-8')\n    n = s.count(before)\n   \
        \ if n != 1:\n        raise AssertionError(f'{path}: anchor match count {n}, expected 1: {before[:90]!r}')\n    path.write_text(s.replace(before,\
        \ after, 1), encoding='utf-8')\n\ndef add_import(path: Path, line: str) -> None:\n    s = path.read_text(encoding='utf-8')\n\
        \    if line in s: return\n    once(path, 'package tv.own.owntv.' + str(path.relative_to(BASE).with_suffix('')).replace('/',\
        \ '.') + '\\n',\n         'package tv.own.owntv.' + str(path.relative_to(BASE).with_suffix('')).replace('/', '.')\
        \ + '\\n\\n' + line + '\\n')\n\n# --------------------------------------------------------------------------\n# Compact,\
        \ scrollable small-phone home. Do not move system navigation/Player.\n# --------------------------------------------------------------------------\n\
        landing = BASE/'features/home/MovioLandingScreen.kt'\nfor directive in ('import androidx.compose.foundation.rememberScrollState',\n\
        \                  'import androidx.compose.foundation.verticalScroll'):\n    once(landing, 'import androidx.compose.foundation.clickable\\\
        n',\n         'import androidx.compose.foundation.clickable\\n'+directive+'\\n') if directive not in landing.read_text()\
        \ else None\nonce(landing,\n'''        val tileHeight = if (wide) (if (short) 126.dp else 222.dp) else (if (short)\
        \ 82.dp else 118.dp)\n        val edge = if (wide) 48.dp else 20.dp\n        Column(\n            modifier = Modifier.fillMaxSize().padding(horizontal\
        \ = edge, vertical = if (short) 10.dp else 25.dp),\n            verticalArrangement = Arrangement.Center,\n      \
        \  ) {''',\n'''        val compactTouch = touchMode && !wide\n        val tileHeight = if (wide) (if (short) 126.dp\
        \ else 222.dp) else (if (short) 76.dp else 108.dp)\n        val edge = if (wide) 48.dp else 20.dp\n        // Small\
        \ screens must scroll ABOVE the fixed player/navigation overlays. Never crop Series.\n        // Use the available\
        \ constraints, not device-model or screen-resolution guesses.\n        Column(\n            modifier = Modifier.fillMaxSize()\n\
        \                .then(if (compactTouch) Modifier.verticalScroll(rememberScrollState()) else Modifier)\n         \
        \       .padding(horizontal = edge)\n                .padding(top = if (compactTouch) 64.dp else if (short) 10.dp\
        \ else 25.dp,\n                         bottom = if (compactTouch) 112.dp else if (short) 10.dp else 25.dp),\n   \
        \         verticalArrangement = if (compactTouch) Arrangement.Top else Arrangement.Center,\n        ) {''')\n\n# --------------------------------------------------------------------------\n\
        # SETUP: do not treat provider import failures as green-tick success.\n# --------------------------------------------------------------------------\n\
        cloud = BASE/'features/setup/MovioCloudFirstRun.kt'\nassert cloud.is_file(), 'Cloud-first wizard not present: V9 recipe\
        \ changed'\nonce(cloud, '                            restorer.restore(localId, remoteId, bootstrap,',\n     '    \
        \                        val restoreOutcome = restorer.restore(localId, remoteId, bootstrap,')\nonce(cloud,\n''' \
        \                           done.add(localId)''',\n'''                            // A completed function is NOT proof\
        \ that catalogues loaded.\n                            // Keep already-imported sources and local viewing data intact\
        \ on retry.\n                            if (restoreOutcome.failedCatalogs > 0) {\n                              \
        \  throw java.io.IOException(\"MOVIO_PROVIDER_CATALOGUE_FAILED\")\n                            }\n               \
        \             done.add(localId)''')\nonce(cloud, '                    progress = when {',\n'''                   \
        \ progress = when {\n                        detail.contains(\"MOVIO_PROVIDER_CATALOGUE_FAILED\") ->\n           \
        \                 res.getString(R.string.moviotv_v91_provider_failed)''')\n\n# TV layout: stage labels in two rows\
        \ of four one-line statuses; single column on phones.\nfor directive in ('import androidx.compose.foundation.layout.BoxWithConstraints',\n\
        \                  'import androidx.compose.foundation.layout.Row',\n                  'import androidx.compose.ui.text.style.TextOverflow'):\n\
        \    if directive not in cloud.read_text(encoding='utf-8'):\n        once(cloud, 'import androidx.compose.foundation.background\\\
        n',\n             'import androidx.compose.foundation.background\\n'+directive+'\\n')\ns=cloud.read_text(encoding='utf-8')\n\
        pattern = re.compile(r'(?P<indent>^[ ]{12})steps\\.forEachIndexed \\{ index, item ->\\n(?P<body>.*?)\\n(?P=indent)\\\
        }',re.MULTILINE|re.DOTALL)\nms=list(pattern.finditer(s))\nassert len(ms)==1, f'TV stage-layout anchor mismatch: {len(ms)}'\n\
        old=ms[0].group(0)\n# Compose scope Row controls Modifier.weight; each stage remains a single line, no overlap.\n\
        new='''            BoxWithConstraints(Modifier.fillMaxWidth()) {\n                if (maxWidth >= 780.dp) {\n    \
        \                Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {\n                        repeat(2) {\
        \ stageRow ->\n                            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(14.dp))\
        \ {\n                                repeat(4) { stageColumn ->\n                                    val index = stageRow\
        \ * 4 + stageColumn\n                                    val indicator = if (index < stage) stringResource(R.string.moviotv_step_done)\n\
        \                                        else if (index == stage) stringResource(R.string.moviotv_step_active)\n \
        \                                       else stringResource(R.string.moviotv_step_waiting)\n                     \
        \               Text(indicator + steps[index], modifier = Modifier.weight(1f),\n                                 \
        \       style = stageText(14, if (index == stage) 600 else 400),\n                                        color =\
        \ if (index < stage) Color(0xFF69DA90) else if (index == stage) StageColors.Text else StageColors.Muted,\n       \
        \                                 maxLines = 1, overflow = TextOverflow.Ellipsis)\n                              \
        \  }\n                            }\n                        }\n                    }\n                } else {\n\
        '''+old+'''\n                }\n            }'''\ncloud.write_text(s.replace(old,new,1),encoding='utf-8')\n\n# Live\
        \ Room-backed counts: display as centred three-column panels on wide TV.\ncatalogue=BASE/'features/setup/MovioV9CatalogueActivity.kt'\n\
        assert catalogue.is_file(), 'V9 Room-backed catalogue counter missing'\ncatalogue.write_text('''package tv.own.owntv.features.setup\n\
        \nimport androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.BoxWithConstraints\n\
        import androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.fillMaxWidth\n\
        import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.produceState\n\
        import androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.res.stringResource\n\
        import androidx.compose.ui.text.style.TextAlign\nimport androidx.compose.ui.unit.dp\nimport androidx.tv.material3.Text\n\
        import kotlinx.coroutines.ExperimentalCoroutinesApi\nimport kotlinx.coroutines.flow.combine\nimport kotlinx.coroutines.flow.collect\n\
        import kotlinx.coroutines.flow.flatMapLatest\nimport kotlinx.coroutines.flow.flowOf\nimport org.koin.core.context.GlobalContext\n\
        import tv.own.owntv.R\nimport tv.own.owntv.core.database.OwnTVDatabase\nimport tv.own.owntv.ui.theme.StageColors\n\
        import tv.own.owntv.ui.theme.stageText\nimport java.text.NumberFormat\n\n/** Only actual imported Room rows are counted.\
        \ No fabricated percentages or timers. */\n@OptIn(ExperimentalCoroutinesApi::class)\n@Composable\ninternal fun MovioV9CatalogueActivity()\
        \ {\n    val counts by produceState(Triple(0, 0, 0)) {\n        val db: OwnTVDatabase = GlobalContext.get().get()\n\
        \        db.sourceDao().observeAll().flatMapLatest { sources ->\n            val ids = sources.map { it.id }\n   \
        \         if (ids.isEmpty()) flowOf(Triple(0, 0, 0))\n            else combine(db.movieDao().countAll(ids), db.seriesDao().countAll(ids),\n\
        \                db.channelDao().countAll(ids)) { movies, series, live ->\n                Triple(movies, series,\
        \ live)\n            }\n        }.collect { value = it }\n    }\n    val names = listOf(stringResource(R.string.common_nav_movies),\n\
        \        stringResource(R.string.common_nav_series), stringResource(R.string.common_nav_live_tv))\n    val symbols\
        \ = listOf(stringResource(R.string.moviotv_icon_movies),\n        stringResource(R.string.moviotv_icon_series), stringResource(R.string.moviotv_icon_play))\n\
        \    val values = listOf(counts.first, counts.second, counts.third)\n    BoxWithConstraints(Modifier.fillMaxWidth())\
        \ {\n        if (maxWidth >= 720.dp) {\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(14.dp))\
        \ {\n                repeat(3) { i ->\n                    Column(Modifier.weight(1f), horizontalAlignment = Alignment.CenterHorizontally,\n\
        \                        verticalArrangement = Arrangement.spacedBy(3.dp)) {\n                        Text(symbols[i],\
        \ style = stageText(24, 500), color = StageColors.Text)\n                        Text(names[i], style = stageText(15,\
        \ 500), color = StageColors.Muted,\n                            textAlign = TextAlign.Center)\n                  \
        \      Text(NumberFormat.getInstance().format(values[i]),\n                            style = stageText(23, 700),\
        \ color = StageColors.Text,\n                            textAlign = TextAlign.Center)\n                    }\n  \
        \              }\n            }\n        } else {\n            Column(Modifier.fillMaxWidth(), verticalArrangement\
        \ = Arrangement.spacedBy(3.dp)) {\n                repeat(3) { i ->\n                    Text(stringResource(R.string.moviotv_v9_catalogue_count,\
        \ names[i], values[i]),\n                        style = stageText(15, 600), color = StageColors.Text)\n         \
        \       }\n            }\n        }\n    }\n}\n''',encoding='utf-8')\n\n# Existing SourceTestDialog already independently\
        \ reads Internet / VPN / provider status.\n# Re-evaluate the provider if the network route changes DURING a visible\
        \ failure, even if\n# a VPN makes Internet stay 'online' throughout the transition.\nnet=BASE/'features/shell/MovioNetworkRevision.kt'\n\
        net.write_text('''package tv.own.owntv.features.shell\n\nimport android.content.Context\nimport android.net.ConnectivityManager\n\
        import android.net.Network\nimport android.net.NetworkCapabilities\nimport android.os.Handler\nimport android.os.Looper\n\
        import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.DisposableEffect\nimport androidx.compose.runtime.getValue\n\
        import androidx.compose.runtime.mutableLongStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\n\
        import androidx.compose.ui.platform.LocalContext\n\n/** Event-only Android connectivity changes; absolutely no 5-second\
        \ polling. */\n@Composable\ninternal fun rememberMovioNetworkRevision(): Long {\n    val context = LocalContext.current.applicationContext\n\
        \    var revision by remember { mutableLongStateOf(0L) }\n    DisposableEffect(context) {\n        val manager = context.getSystemService(Context.CONNECTIVITY_SERVICE)\
        \ as ConnectivityManager\n        val handler = Handler(Looper.getMainLooper())\n        val callback = object : ConnectivityManager.NetworkCallback()\
        \ {\n            override fun onAvailable(network: Network) { handler.post { revision++ } }\n            override\
        \ fun onLost(network: Network) { handler.post { revision++ } }\n            override fun onCapabilitiesChanged(network:\
        \ Network, caps: NetworkCapabilities) {\n                handler.post { revision++ }\n            }\n        }\n \
        \       val registered = runCatching { manager.registerDefaultNetworkCallback(callback); true }\n            .getOrDefault(false)\n\
        \        onDispose { if (registered) runCatching { manager.unregisterNetworkCallback(callback) } }\n    }\n    return\
        \ revision\n}\n''',encoding='utf-8')\nshell=BASE/'features/shell/OwnTVShell.kt'\nassert shell.is_file()\nonce(shell,\n\
        '''    // If connectivity returns while the panel is visible, automatically re-check the source.''',\n'''    // VPN\
        \ changes can change a provider route without toggling the general Internet flag.\n    // Run a single debounced source\
        \ re-test only while the diagnostics panel is visible.\n    val movioNetworkRevision = rememberMovioNetworkRevision()\n\
        \    LaunchedEffect(movioNetworkRevision, v77AutoDiagnosticVisible) {\n        if (movioNetworkRevision > 1L && v77AutoDiagnosticVisible\
        \ && playerMode != PlayerMode.NONE) {\n            kotlinx.coroutines.delay(1_200L)\n            v76LatestSources.firstOrNull\
        \ { it.id == watchingSourceId }?.let(v76DiagnosticsVm::testSource)\n        }\n    }\n    // If connectivity returns\
        \ while the panel is visible, automatically re-check the source.''')\n\n# Actionable, non-secret setup failure. Prefer\
        \ existing locale if translated in next milestone.\nvalues=RES/'values/strings_moviotv_v91.xml'\nvalues.write_text('''<?xml\
        \ version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n  <string name=\"moviotv_v91_provider_failed\">Provider catalogue\
        \ could not load. Internet, VPN or provider access may have changed. Previously saved data is safe. Check the provider\
        \ connection and retry.</string>\n</resources>\n''',encoding='utf-8')\nET.parse(values)\n\n# Build must fail safely\
        \ on any mismatch, not silently skip a feature.\nassert 'val restoreOutcome = restorer.restore(' in cloud.read_text()\n\
        assert 'restoreOutcome.failedCatalogs > 0' in cloud.read_text()\nassert 'BoxWithConstraints' in cloud.read_text()\n\
        assert 'Modifier.verticalScroll(rememberScrollState())' in landing.read_text()\nassert 'NumberFormat.getInstance().format(values[i])'\
        \ in catalogue.read_text()\nassert 'rememberMovioNetworkRevision()' in shell.read_text()\nprint('PASS: V9.1 generated\
        \ source patch: real provider failure, TV layout, mobile scroll, VPN route recovery')\nprint('BLOCKED: remote Force\
        \ Close requires Central push/ack API; not falsely advertised as working')\nPY_V91\npython3 -m py_compile /tmp/moviotv_v91_patch.py\n\
        python3 /tmp/moviotv_v91_patch.py\npython3 - <<'PY_PREFLIGHT'\nfrom pathlib import Path\nimport xml.etree.ElementTree\
        \ as ET\nroot=Path('app/src/main/java/tv/own/owntv')\nassert 'failedCatalogs > 0' in (root/'features/setup/MovioCloudFirstRun.kt').read_text()\n\
        assert 'BoxWithConstraints' in (root/'features/setup/MovioV9CatalogueActivity.kt').read_text()\nassert 'rememberMovioNetworkRevision'\
        \ in (root/'features/shell/OwnTVShell.kt').read_text()\nassert 'verticalScroll(rememberScrollState())' in (root/'features/home/MovioLandingScreen.kt').read_text()\n\
        ET.parse('app/src/main/res/values/strings_moviotv_v91.xml')\nprint('V9.1 source preflight passed. NOTE: Central push/ack\
        \ handover remains intentionally disabled.')\nPY_PREFLIGHT\n"
    - name: 02B - Apply authenticated Smart Handover Kotlin/UI source patch
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/MovioV91Handover.kt <<'MOVIO_KOTLIN_HANDOVER'\npackage tv.own.owntv.features.central\n\
        \nimport android.content.Context\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.currentCoroutineContext\n\
        import kotlinx.coroutines.delay\nimport kotlinx.coroutines.ensureActive\nimport kotlinx.coroutines.withContext\nimport\
        \ org.json.JSONObject\nimport tv.own.owntv.core.database.entity.SourceEntity\nimport java.security.MessageDigest\n\
        import java.util.UUID\n\n/** One session's event-based handover. No background heartbeat or generic live polling.\
        \ */\ninternal class MovioV91Handover(private val context: Context) {\n    private val api = MovioCentralApi(context.applicationContext)\n\
        \n    // The same provider on TV/phone has the same key without transmitting Xtream passwords.\n    fun providerKey(source:\
        \ SourceEntity): String {\n        val server = source.url.trim().trimEnd('/').lowercase()\n        val user = source.username.orEmpty().trim().lowercase()\n\
        \        val canonical = \"xtream|$server|$user\"\n        return MessageDigest.getInstance(\"SHA-256\").digest(canonical.toByteArray(Charsets.UTF_8))\n\
        \            .joinToString(\"\") { \"%02x\".format(it.toInt() and 255) }\n    }\n\n    fun newSessionId(): String\
        \ = UUID.randomUUID().toString()\n\n    suspend fun start(profileId: Long, source: SourceEntity, sessionId: String,\
        \ type: String): Boolean =\n        runCatching {\n            if (!api.hasSession() || !api.ensureHandoverDevice())\
        \ return@runCatching false\n            api.handover(\"start\", \"POST\", JSONObject()\n                .put(\"session_id\"\
        , sessionId)\n                .put(\"profile_id\", profileId)\n                .put(\"provider_key\", providerKey(source))\n\
        \                .put(\"content_type\", type)\n                .put(\"content_label\", source.name))\n           \
        \ true\n        }.getOrDefault(false)\n\n    suspend fun stop(sessionId: String) {\n        runCatching { if (api.hasSession())\
        \ api.handover(\"stop\", \"POST\", JSONObject().put(\"session_id\", sessionId)) }\n    }\n\n    /** Long polling is\
        \ active ONLY while this playback session exists; no 5-second heartbeats. */\n    suspend fun listenForRemoteStop(sessionId:\
        \ String, stopLocal: suspend () -> Boolean) {\n        while (true) {\n            currentCoroutineContext().ensureActive()\n\
        \            val next = try { api.handover(\"next?wait=20\", \"GET\", readTimeoutMs = 35000) }\n                catch\
        \ (cancel: kotlinx.coroutines.CancellationException) { throw cancel }\n                catch (_: Exception) { delay(10_000);\
        \ continue }\n            val command = next.optJSONObject(\"command\") ?: continue\n            if (command.optString(\"\
        action\") != \"stop\" || command.optString(\"session_id\") != sessionId) continue\n            currentCoroutineContext().ensureActive()\n\
        \            val cmdId = command.optString(\"command_id\")\n            // The stop action itself must complete even\
        \ if changing player mode\n            // disposes the Compose observer and cancels its listening coroutine.\n   \
        \         val didStop = runCatching { withContext(kotlinx.coroutines.NonCancellable + Dispatchers.Main) {\n      \
        \          stopLocal()\n            } }.getOrDefault(false)\n            // Confirmation means the old LOCAL player\
        \ stopped; provider 0/1 may take longer.\n            withContext(kotlinx.coroutines.NonCancellable) {\n         \
        \       runCatching { api.handover(\"ack\", \"POST\", JSONObject()\n                    .put(\"command_id\", cmdId).put(\"\
        session_id\", sessionId).put(\"stopped\", didStop)) }\n            }\n            if (didStop) return\n        }\n\
        \    }\n\n    /** Light Xtream connection count probe, never opens a second video stream. */\n    private suspend\
        \ fun hasFreeCapacity(source: SourceEntity): Boolean? = withContext(Dispatchers.IO) {\n        val server=source.url.trim().trimEnd('/')\n\
        \        val user=java.net.URLEncoder.encode(source.username.orEmpty(), \"UTF-8\")\n        val pass=java.net.URLEncoder.encode(source.password.orEmpty(),\
        \ \"UTF-8\")\n        val connection=(java.net.URL(\"$server/player_api.php?username=$user&password=$pass\")\n   \
        \         .openConnection() as java.net.HttpURLConnection).apply {\n                connectTimeout=7000; readTimeout=7000\n\
        \            }\n        try {\n            if (connection.responseCode !in 200..299) return@withContext null\n   \
        \         val data=JSONObject(connection.inputStream.bufferedReader().use { it.readText() })\n            val info=data.optJSONObject(\"\
        user_info\") ?: return@withContext null\n            val current=info.optInt(\"active_cons\",-1)\n            val\
        \ max=info.optInt(\"max_connections\",-1)\n            if (current<0 || max<=0) null else current<max\n        } catch\
        \ (_:Exception) { null }\n        finally { connection.disconnect() }\n    }\n\n    /** Bounded capacity checks only\
        \ after a confirmed device stop. */\n    suspend fun awaitProviderCapacity(source: SourceEntity, seconds:Int=60):Boolean\
        \ {\n        val until=android.os.SystemClock.elapsedRealtime()+seconds*1000L\n        val delaySteps=longArrayOf(0L,2000,3000,4000,5000,6000,8000,10000)\n\
        \        var i=0\n        while (android.os.SystemClock.elapsedRealtime()<until) {\n            currentCoroutineContext().ensureActive()\n\
        \            if (hasFreeCapacity(source)==true) return true\n            delay(delaySteps[i.coerceAtMost(delaySteps.lastIndex)])\n\
        \            i++\n        }\n        return false\n    }\n\n    suspend fun others(provider: String): JSONObject =\
        \ api.handover(\"sessions?provider_key=$provider\", \"GET\")\n\n    suspend fun request(provider: String, targetSession:\
        \ String): JSONObject =\n        api.handover(\"request\", \"POST\", JSONObject()\n            .put(\"provider_key\"\
        , provider).put(\"target_session\", targetSession))\n\n    suspend fun status(commandId: String): JSONObject = api.handover(\"\
        status?command_id=$commandId\", \"GET\")\n\n    suspend fun cancel(commandId: String) {\n        runCatching { api.handover(\"\
        cancel\", \"POST\", JSONObject().put(\"command_id\", commandId)) }\n    }\n\n    /** Target device must acknowledge.\
        \ Provider capacity is an ADDITIONAL check before playback. */\n    suspend fun awaitAcknowledgement(commandId: String,\
        \ seconds: Int = 60): Boolean {\n        val until = android.os.SystemClock.elapsedRealtime() + seconds * 1000L\n\
        \        val delays = longArrayOf(2000,3000,4000,5000,6000,8000,10000)\n        var i = 0\n        while (android.os.SystemClock.elapsedRealtime()\
        \ < until) {\n            currentCoroutineContext().ensureActive()\n            val status = try { status(commandId).optString(\"\
        status\") }\n                catch (cancel: kotlinx.coroutines.CancellationException) { throw cancel }\n         \
        \       catch (_: Exception) { delay(2500L); continue }\n            if (status == \"acknowledged\") return true\n\
        \            if (status in setOf(\"failed\", \"expired\", \"cancelled\", \"not_found\")) return false\n          \
        \  delay(delays[i.coerceAtMost(delays.lastIndex)])\n            i++\n        }\n        return false\n    }\n}\nMOVIO_KOTLIN_HANDOVER\n\
        cat > /tmp/MovioV91HandoverDialog.kt <<'MOVIO_KOTLIN_DIALOG'\npackage tv.own.owntv.features.central\n\nimport androidx.compose.foundation.layout.Arrangement\n\
