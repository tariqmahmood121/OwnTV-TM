name: MovioTV V9.4 INTEGRATION QA - V9.3 baseline with profile-health domain prechecks
run-name: MovioTV V9.4 Integration QA - ${{ github.ref_name }} #${{ github.run_number }}
"on":
  workflow_dispatch:
  push:
    branches:
      - moviotv-v9
    paths:
      - .github/workflows/moviotv-v94-integration-qa-onefile.yml
permissions:
  contents: read
concurrency:
  group: moviotv-v94-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  v94-domain-compiler-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      VERSION_NAME: 9.4.0-integration-qa
      VERSION_CODE: '100241'
    steps:
      - name: Checkout known MovioTV V9 source
        uses: actions/checkout@v4
        with:
          ref: moviotv-v9
          fetch-depth: 0
      - name: Checkout pinned OwnTV core from verified V9.3 build
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV_Core
          ref: 0b60ef6d25e03a24193f1a5680cb239816fd8625
          path: moviotv-core
          persist-credentials: false
      - name: Checkout verified V8.1 patch reference
        uses: actions/checkout@v4
        with:
          repository: tariqmahmood121/OwnTV-TM
          ref: feature/moviotv-v81-stability
          path: moviotv-v81-verified
          persist-credentials: false
      - name: Setup JDK 25 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Replay EXACT verified V9.3 QA7B generated-source steps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'
          python3 - <<'PY_REPLAY'
          import subprocess, yaml
          from pathlib import Path
          p=Path('.github/workflows/moviotv-v93-qa7b-new-filename.yml')
          assert p.is_file(), 'Verified V9.3 QA7B source recipe missing'
          doc=yaml.safe_load(p.read_text(encoding='utf8'))
          steps=doc['jobs']['v93-responsive-qa']['steps']
          prefixes=('01 - ', '02 - ', '03 - ', '04 - ', '04x - ')
          found=[]
          for prefix in prefixes:
              matches=[s for s in steps if s.get('name','').startswith(prefix) and 'run' in s]
              if len(matches) != 1: raise RuntimeError('Expected one source step for '+prefix)
              step=matches[0]
              print('RUN VERIFIED BASE:',step['name'],flush=True)
              subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
              found.append(step['name'])
          assert len(found)==5
          PY_REPLAY
      - name: Install V9.4 profile/health/wizard QA source files and tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/moviotv-v94-embedded
