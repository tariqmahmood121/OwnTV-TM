# SINGLE FILE: upload to .github/workflows/moviotv-v79-one-file.yml
# Branch: feature/moviotv-v78 (NOT main). Push triggers this workflow automatically.
# After a successful build, code is saved on a new feature/moviotv-v79-oak-tablet-focus branch.
name: MovioTV V7.9 - One File Oak Studio Tablet Smart Back
'on':
  push:
    branches: [feature/moviotv-v78]
    paths: [.github/workflows/MovioTV-V7.9-Compile-Fix.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moviotv-v79-unified
  cancel-in-progress: false
jobs:
  moviotv-v79:
    if: github.ref == 'refs/heads/feature/moviotv-v78'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION_CODE: '100016'
      VERSION_NAME: '7.9'
    steps:
      - name: Checkout protected V7.8 source
        uses: actions/checkout@v4
        with:
          ref: feature/moviotv-v78
          fetch-depth: 0
          persist-credentials: true
      - name: Apply ALL V7.9 changes to checked-out source only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/moviotv_v79_patch.py <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('app/src/main/java/tv/own/owntv')

          def patch(path, old, new, count=1):
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              n = data.count(old)
              if n != count:
                  raise SystemExit('SAFE PATCH FAILED %s: expected %d anchor(s), got %d for %r' % (p, count, n, old[:120]))
              p.write_text(data.replace(old, new, count), encoding='utf-8')
              print('PATCHED', p)

          def add(path, content):
              p = Path(path)
              if p.exists():
                  raise SystemExit('Refusing to overwrite existing file: ' + str(p))
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.strip() + '\n', encoding='utf-8')
              print('ADDED', p)

          # App ID stability. Normal update candidates must use tv.own.owntv across builds.
          patch('app/build.gradle.kts', '''            // MovioTV QA only: independent installation and private data sandbox.
                      applicationIdSuffix = ".moviotv78"
          ''', '''            // V7.9+: stable application ID for update-in-place. A matching signing key is ALSO required.
                      // Never rename the package or delete databases during an upgrade.
          ''')
          patch('app/src/main/res/values/strings_moviotv.xml', '<string name="moviotv_version">v7.8</string>', '<string name="moviotv_version">v7.9</string>')

          # Tablet-first automatic scaling. Avoid changing TV density or overriding user-set zoom.
          patch('app/src/main/java/tv/own/owntv/MainActivity.kt', '''                val base = LocalDensity.current
          ''', '''                val base = LocalDensity.current
                          // 12-inch and other large touch tablets otherwise render the TV design at tiny sizes.
                          // This is a constant layout factor, not a per-frame calculation or animation.
                          val screen = androidx.compose.ui.platform.LocalConfiguration.current
                          val tvMode = (screen.uiMode and android.content.res.Configuration.UI_MODE_TYPE_MASK) ==
                              android.content.res.Configuration.UI_MODE_TYPE_TELEVISION
                          val tabletScale = if (tvMode) 1f else when {
                              screen.smallestScreenWidthDp >= 840 -> 1.20f
                              screen.smallestScreenWidthDp >= 600 -> 1.12f
                              else -> 1f
                          }
          ''')
          patch('app/src/main/java/tv/own/owntv/MainActivity.kt', '''                        base.density * UiZoom.factor(uiZoomPercent),''', '''                        base.density * UiZoom.factor(uiZoomPercent) * tabletScale,''')

          # Strong, theme-derived D-pad focus. Minimal extra rendering, no animations added.
          focus = ROOT/'ui/stage/StageComponents.kt'
          patch(focus, 'drawInnerRing(a.focus, 2 * px, r)', 'drawInnerRing(a.focus, 3 * px, r)')
          patch(focus, 'drawOuterRing(a.focus, 2 * px, r)', 'drawOuterRing(a.focus, 3 * px, r)')
          patch(focus, 'drawOuterRing(a.focus, 3 * px, r)', 'drawOuterRing(a.focus, 4 * px, r)', 3) # all visible focus indicators

          # Two-stage remote OK: do not open details early if the user is aiming for options.
          # On key UP: tap=existing; 0.9-2.999 s=details; >=3s=menu. This prevents double activation.
          patch(focus, 'import androidx.compose.ui.focus.FocusRequester\n', '''import androidx.compose.ui.focus.FocusRequester
          import androidx.compose.ui.input.key.KeyEventType
          import androidx.compose.ui.input.key.onPreviewKeyEvent
          import androidx.compose.ui.input.key.type
          ''')
          patch(focus, '''    watched: Boolean = false,
              artwork: @Composable BoxScope.() -> Unit,
          ''', '''    watched: Boolean = false,
              /** Optional TV D-pad hold handlers. Normal touch click/long-click remains unchanged. */
              onDetailsHold: (() -> Unit)? = null,
              onOptionsHold: (() -> Unit)? = null,
              artwork: @Composable BoxScope.() -> Unit,
          ''')
          patch(focus, '''    val badge = Color(8, 12, 14)
              Column(
                  modifier
                      .width(width)
                      .stageLift(focused, StageFocus.POSTER)
                      .stageClickable(interaction, true, onClick, onLongClick),
          ''', '''    val badge = Color(8, 12, 14)
              var okDownAt by remember { androidx.compose.runtime.mutableLongStateOf(0L) }
              val stagedRemoteOk = if (onDetailsHold != null && onOptionsHold != null)
                  Modifier.onPreviewKeyEvent { event ->
                      val native = event.nativeKeyEvent
                      val ok = native.keyCode == android.view.KeyEvent.KEYCODE_DPAD_CENTER ||
                          native.keyCode == android.view.KeyEvent.KEYCODE_ENTER ||
                          native.keyCode == android.view.KeyEvent.KEYCODE_NUMPAD_ENTER
                      if (!ok) false else when (event.type) {
                          KeyEventType.KeyDown -> {
                              if (okDownAt == 0L) okDownAt = native.eventTime.coerceAtLeast(1L)
                              true // Consume auto-repeat DOWN events; no action during a hold.
                          }
                          KeyEventType.KeyUp -> {
                              val start = okDownAt
                              okDownAt = 0L
                              if (start > 0L) {
                                  val held = (native.eventTime - start).coerceAtLeast(0L)
                                  when {
                                      held >= 3000L -> onOptionsHold?.invoke()
                                      held >= 900L -> onDetailsHold?.invoke()
                                      else -> onClick()
                                  }
                              }
                              true // A new press is required to activate anything in the newly opened menu.
                          }
                          else -> false
                      }
                  } else Modifier
              Column(
                  modifier
                      .width(width)
                      .stageLift(focused, StageFocus.POSTER)
                      .then(stagedRemoteOk)
                      .stageClickable(interaction, true, onClick, onLongClick),
          ''')

