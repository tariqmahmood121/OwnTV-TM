          # The app's SettingsSearchCoverageTest requires EVERY new row/tab to be searchable.
          patch(settings, '''        SettingsSearchEntry(stringResource(R.string.settings_group_app), stringResource(R.string.settings_app_icon),''', '''        SettingsSearchEntry(stringResource(R.string.settings_group_app), stringResource(R.string.moviotv_about_title), stringResource(R.string.moviotv_about_developed), OwnTVIcon.INFO, TileTone.PRIMARY) { open(SettingsTab.ABOUT) },
                  SettingsSearchEntry(stringResource(R.string.settings_group_app), stringResource(R.string.moviotv_smart_back_title), stringResource(R.string.moviotv_smart_back_desc), OwnTVIcon.HISTORY, TileTone.SECONDARY,
                          chip = stringResource(if (smartBackEnabled) R.string.common_on else R.string.common_off)) { onSmartBackChange(!smartBackEnabled) },
                  SettingsSearchEntry(stringResource(R.string.settings_group_app), stringResource(R.string.settings_app_icon),''')

          patch(settings, '''        RootGroup("group_app", stringResource(R.string.settings_app_group), OwnTVIcon.INFO, stringResource(R.string.settings_group_summary_app)),''', '''        RootGroup("group_app", stringResource(R.string.settings_app_group), OwnTVIcon.INFO, stringResource(R.string.settings_group_summary_app)),
                  RootRow(
                      tabRowKey(SettingsTab.ABOUT), TileTone.PRIMARY, OwnTVIcon.INFO,
                      title = stringResource(R.string.moviotv_about_title),
                      desc = stringResource(R.string.moviotv_about_developed),
                      focus = rowFocus.getValue(SettingsTab.ABOUT),
                      onClick = { open(SettingsTab.ABOUT) },
                  ),
                  RootRow(
                      "smart_back", TileTone.SECONDARY, OwnTVIcon.HISTORY,
                      title = stringResource(R.string.moviotv_smart_back_title),
                      desc = stringResource(R.string.moviotv_smart_back_desc),
                      chip = stringResource(if (smartBackEnabled) R.string.common_on else R.string.common_off),
                      onClick = { onSmartBackChange(!smartBackEnabled) },
                  ),''')

          # 7 English resource strings. No hardcoded UI labels in Kotlin.
          resources = Path('app/src/main/res/values/strings_moviotv.xml')
          text = resources.read_text(encoding='utf-8')
          extra = {
              'moviotv_oak_studios': 'OAK STUDIOS',
              'moviotv_about_title': 'About MovioTV',
              'moviotv_about_studio_subtitle': 'Independent software studio',
              'moviotv_about_version': 'Version %1$s',
              'moviotv_about_developed': 'Developed by Oak Studios',
              'moviotv_about_created': 'Created by ZIGGS',
              'moviotv_about_licence': 'Built on OwnTV open-source software (GPL-3.0). Original authors and third-party licences remain acknowledged.',
              'moviotv_smart_back_title': 'Smart Back Navigation',
              'moviotv_smart_back_desc': 'Back retraces your journey instead of losing your place',
          }
          for k,v in extra.items():
              if ('name="%s"'%k) in text:
                  raise SystemExit('Duplicate resource name '+k)
              text=text.replace('</resources>', '    <string name="%s">%s</string>\n</resources>'%(k,v))
          resources.write_text(text,encoding='utf-8')

          # i18n checker: classify ONLY new non-screen technical keys from the files above.
          # Any new unexpected user-visible strings still stop the build.
          import runpy
          mod = runpy.run_path('tools/i18n/check_hardcoded_strings.py')
          old_base = mod['_parse'](mod['BASELINE'].read_text(encoding='utf-8'))
          current = mod['_inventory']()
          safe, cats, problems = mod['_safe_entries']()
          if problems: raise SystemExit('Existing safe manifest invalid: %r' % problems[:3])
          whitelist = (
              '/features/search/MovioCreditIndex.kt',
              '/features/home/MovioSettingsPinch.kt',
              '/features/settings/MovioAboutScreen.kt',
          )
          known = {
              'app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt': {'moviotv_smart_back_v79', 'enabled_'},
              'app/src/main/java/tv/own/owntv/features/shell/components/SettingsScreen.kt': {'smart_back'},
              'app/src/main/java/tv/own/owntv/features/movies/MoviesScreen.kt': {'[]', 'moviotv_safe_play'},
          }
          pending=[]
          for key, count in current.items():
              diff = count-old_base.get(key,0)-safe.get(key,0)
              if diff <= 0: continue
              path, literal = key
              if path.endswith(whitelist) or literal in known.get(path,set()):
                  safe[key] = count-old_base.get(key,0)
                  cats[key] = 'technical'
              else:
                  pending.append((path,literal,diff))
          if pending:
              for x in pending[:20]: print('UNCLASSIFIED',repr(x))
              raise SystemExit('Unexpected Kotlin strings must be reviewed before compile')
          mod['SAFE_MANIFEST'].write_text(mod['_serialize_safe']({k:(v,cats[k]) for k,v in safe.items()}), encoding='utf-8')
          print('MovioTV V7.9 unified patch completed; working source branch not modified')
          PY
          python3 /tmp/moviotv_v79_patch.py
      - name: Translation baseline and Kotlin UI literal gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/i18n/check_hardcoded_strings.py verify --bootstrap
      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + Android lint + compile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest lintStandardDebug assembleStandardDebug --stacktrace
      - name: Verify stable application ID before upload
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          test -f app/build/outputs/apk/standard/debug/app-standard-debug.apk
          "$aapt" dump badging app/build/outputs/apk/standard/debug/app-standard-debug.apk > /tmp/moviotv-badging.txt
          grep -F "package: name='tv.own.owntv'" /tmp/moviotv-badging.txt
          grep -F "versionName='7.9'" /tmp/moviotv-badging.txt
          grep -F "versionCode='100016'" /tmp/moviotv-badging.txt
      - name: Upload unsigned-for-upgrade debug QA APK
        uses: actions/upload-artifact@v4
        with:
          name: MovioTV-V7.9-DEBUG-NOT-FOR-DATA-PRESERVING-UPGRADE
          path: app/build/outputs/apk/standard/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Configure optional EXISTING release signing certificate
        id: sign
        shell: bash
        env:
          KEY_B64: ${{ secrets.MOVIOTV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOVIOTV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOVIOTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOVIOTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEY_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/moviotv-existing.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo 'No existing signing key configured. A fresh debug APK CANNOT upgrade a differently signed installed app.'
          fi
      - name: Build true in-place upgrade APK with SAME existing release key
        if: steps.sign.outputs.configured == 'true'
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/moviotv-existing.jks
          KEYSTORE_PASSWORD: ${{ secrets.MOVIOTV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOVIOTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOVIOTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleStandardRelease --stacktrace
          test -f app/build/outputs/apk/standard/release/app-standard-release.apk
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$aapt" dump badging app/build/outputs/apk/standard/release/app-standard-release.apk > /tmp/moviotv-release-badging.txt
          grep -F "package: name='tv.own.owntv'" /tmp/moviotv-release-badging.txt
          grep -F "versionName='7.9'" /tmp/moviotv-release-badging.txt
          grep -F "versionCode='100016'" /tmp/moviotv-release-badging.txt
      - name: Upload signed in-place release upgrade
        if: steps.sign.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MovioTV-V7.9-RELEASE-PRESERVE-DATA
          path: app/build/outputs/apk/standard/release/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Save VERIFIED V7.9 source on new branch ONLY
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c feature/moviotv-v79-oak-tablet-focus
          git add app/build.gradle.kts app/src/main/java/tv/own/owntv app/src/main/res/values/strings_moviotv.xml tools/i18n/safe_literals.txt
          git diff --cached --quiet && { echo 'No changed source to commit'; exit 1; }
          git commit -m 'MovioTV V7.9: Oak Studios, accessible focus, smart back, tablet and credits'
          git push origin HEAD:refs/heads/feature/moviotv-v79-oak-tablet-focus
      - name: Keep debugging evidence if checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MovioTV-V7.9-Failure-Diagnostics
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          retention-days: 14
          if-no-files-found: warn
