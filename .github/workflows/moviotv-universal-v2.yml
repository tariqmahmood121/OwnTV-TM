          #!/usr/bin/env python3
          """Localize MovioTV's new source and classify non-display preference keys.
          
          Runs after apply_universal.py, before Gradle's mandatory i18n ratchet. Safe to
          run repeatedly. All user-facing strings live in app Android resources.
          """
          from pathlib import Path
          import xml.etree.ElementTree as ET
          
          root = Path.cwd()
          base = root / 'app/src/main/java/tv/own/owntv'
          files = [
              base/'features/home/MovioLandingScreen.kt',
              base/'features/home/MovioTouchBrowse.kt',
              base/'features/movies/MoviesScreen.kt',
              base/'features/series/SeriesScreen.kt',
          ]
          # The two existing screens only have one new hard-coded string each; do not
          # change other, existing text in those large files.
          strings = {
              'MOVIO': ('brand_movio', 'MOVIO'),
              'TV': ('brand_tv', 'TV'),
              'Created by ZIGGS': ('credit', 'Created by ZIGGS'),
              'What would you like to watch?': ('welcome', 'What would you like to watch?'),
              'LIVE TV': ('home_live', 'LIVE TV'),
              'MOVIES': ('home_movies', 'MOVIES'),
              'SERIES': ('home_series', 'SERIES'),
              'Watch channels': ('watch_channels', 'Watch channels'),
              'Browse films': ('browse_films', 'Browse films'),
              'Watch episodes': ('watch_episodes', 'Watch episodes'),
              'Interface': ('interface', 'Interface'),
              'Auto': ('mode_auto', 'Auto'),
              'Touch': ('mode_touch', 'Touch'),
              '▶': ('icon_play', '▶'),
              '▣': ('icon_movies', '▣'),
              '▤': ('icon_series', '▤'),
              '⌂': ('icon_home', '⌂'),
              '⋯': ('icon_more', '⋯'),
              'Home': ('nav_home', 'Home'),
              'Live': ('nav_live', 'Live'),
              'Movies': ('nav_movies', 'Movies'),
              'Series': ('nav_series', 'Series'),
              'More': ('nav_more', 'More'),
              'Live TV': ('nav_live_tv', 'Live TV'),
              'Search titles': ('search_titles', 'Search titles'),
              '☰  Categories': ('categories', '☰  Categories'),
          }
          
          for path in files:
              if not path.is_file():
                  raise RuntimeError('Cannot localize absent source: ' + str(path))
              src = path.read_text(encoding='utf-8')
              if path.name in ('MoviesScreen.kt', 'SeriesScreen.kt'):
                  wanted = ['Movies'] if path.name == 'MoviesScreen.kt' else ['Series']
                  # Only the title introduced by the new MovioTouchPosterBrowser branch.
                  for label in wanted:
                      needle = 'title = "' + label + '", category = headerLabel'
                      replacement = 'title = stringResource(R.string.moviotv_' + strings[label][0] + '), category = headerLabel'
                      if needle in src:
                          src = src.replace(needle, replacement, 1)
                      elif replacement not in src:
                          raise RuntimeError('Missing ' + label + ' touch browser title')
              else:
                  for raw, (name, _) in strings.items():
                      src = src.replace('"' + raw + '"', 'stringResource(R.string.moviotv_' + name + ')')
                  if 'import androidx.compose.ui.res.stringResource' not in src:
                      src = src.replace('import androidx.tv.material3.Text', 'import androidx.compose.ui.res.stringResource\nimport androidx.tv.material3.Text', 1)
                  if 'import tv.own.owntv.R' not in src:
                      src = src.replace('import androidx.tv.material3.Text', 'import tv.own.owntv.R\nimport androidx.tv.material3.Text', 1)
              path.write_text(src, encoding='utf-8')
          
          resources = root / 'app/src/main/res/values/strings_moviotv.xml'
          resources.parent.mkdir(parents=True, exist_ok=True)
          xml_lines = ['<?xml version="1.0" encoding="utf-8"?>', '<resources>']
          for name, text in strings.values():
              # XML-escape quotes and special chars; Android strings have single quote apostrophe constraints.
              import xml.sax.saxutils
              text_xml = xml.sax.saxutils.escape(text)
              xml_lines.append('    <string name="moviotv_' + name + '">' + text_xml + '</string>')
          xml_lines.append('</resources>')
          resources.write_text('\n'.join(xml_lines) + '\n', encoding='utf-8')
          ET.parse(resources)
          
          safe = root / 'tools/i18n/safe_literals.txt'
          original = safe.read_text(encoding='utf-8')
          entries = [
              '2\tpreference-key\tapp/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt\tlayout',
              '1\tpreference-key\tapp/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt\tmoviotv_ui',
          ]
          for entry in entries:
              if entry not in original.splitlines():
                  original = original.rstrip('\n') + '\n' + entry + '\n'
          safe.write_text(original, encoding='utf-8')
          print('MovioTV visible strings now in Android resources; preference keys classified.')
          MOVIO_LOCALIZE_EOF
