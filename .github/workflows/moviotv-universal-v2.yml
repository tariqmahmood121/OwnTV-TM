      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build standard ARM test APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleStandardDebug --stacktrace

      - name: Publish the test APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MovioTV-universal-touch-TV-APK
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Commit the validated UI to the development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/res/values/strings_moviotv.xml \
            tools/i18n/safe_literals.txt \
            app/src/main/java/tv/own/owntv/features/home/MovioLayoutMode.kt \
            app/src/main/java/tv/own/owntv/features/home/MovioLandingScreen.kt \
            app/src/main/java/tv/own/owntv/features/home/MovioTouchBrowse.kt \
            app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt \
            app/src/main/java/tv/own/owntv/features/live/LiveScreen.kt \
            app/src/main/java/tv/own/owntv/features/movies/MoviesScreen.kt \
            app/src/main/java/tv/own/owntv/features/series/SeriesScreen.kt
          if git diff --cached --quiet; then
            echo 'Already up to date.'
          else
            git commit -m 'MovioTV: universal mobile touch and Android TV interface'
            git push origin HEAD:refs/heads/feature/moviotv-simple-home
          fi
