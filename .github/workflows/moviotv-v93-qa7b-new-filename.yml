    - name: 04x - Preflight both previous lint failures in actual generated files
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY_QA7B_LINT_PREFLIGHT''

        from pathlib import Path

        import re

        import xml.etree.ElementTree as ET

        root = Path(''app/src/main/java/tv/own/owntv'')

        code = (root / ''features/central/MovioCentralScreen.kt'').read_text(encoding=''utf-8'')

        match = re.search(r''(?m)^([ \t]*)val requestedAccount = user\.trim\(\)\r?\n([ \t]*)api\.signIn\(requestedAccount,
        password\)'', code)

        assert match, ''QA7B account-login source mapping missing''

        assert match.group(1) == match.group(2), ''QA6 SuspiciousIndentation still present: login''

        resources = ET.parse(''app/src/main/res/values/strings_moviotv_v93.xml'')

        items = {x.attrib.get(''name''): (x.text or '''') for x in resources.getroot()}

        message = items[''moviotv_v93_completed_checks'']

        assert message == ''Completed checks: %1$d'', f''QA7B PluralsCandidate regression: {message!r}''

        print(''PASS: both exact QA6 Lint errors prechecked; full Android Lint still mandatory'')

        PY_QA7B_LINT_PREFLIGHT'
    - name: Setup JDK 25 toolchain
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: 04A - Mandatory reviewed i18n literal classification before Gradle
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_V93_SAFE'\nfrom pathlib import Path\nimport importlib.util\n\
        import subprocess\nimport sys\n\nroot=Path.cwd()\nscanner_path=root/'tools/i18n/check_hardcoded_strings.py'\n\
        assert scanner_path.is_file(), 'FAIL: versioned i18n scanner missing'\nspec=importlib.util.spec_from_file_location('moviotv_v93_i18n_gate',scanner_path)\n\
        mod=importlib.util.module_from_spec(spec)\nspec.loader.exec_module(mod)\ncurrent=mod._inventory()\n\
        base=mod._parse(mod.BASELINE.read_text(encoding='utf8'))\nsafe,categories,errors=mod._safe_entries()\n\
        assert not errors, 'Existing safe manifest is invalid: '+str(errors)\n\nprefix='app/src/main/java/tv/own/owntv/'\n\
        # Explicitly reviewed protocol-only literals reported by V9.3 QA4 run 44094049400.\nreviewed={\n\
        \    prefix+'features/central/MovioCentralApi.kt': {\n        '': 'empty',\n        'account':\
        \ 'json', 'account_scope_v92': 'preference-key',\n        'account_type': 'json', 'admin': 'protocol',\n\
        \        'administrator': 'protocol', 'data': 'json', 'normal': 'protocol',\n        'role': 'json',\
        \ 'standard': 'protocol', 'user': 'protocol',\n        'v93_role': 'preference-key', 'v93_username':\
        \ 'preference-key',\n    },\n    prefix+'features/central/MovioCentralScreen.kt': {\n        'admin':\
        \ 'protocol', 'cloud_${owner}_$cloudId': 'preference-key',\n        'data': 'json', 'id': 'json',\
        \ 'is_child': 'json',\n        'is_kids': 'json', 'moviotv_central_profile_owners_v92': 'preference-key',\n\
        \        'moviotv_v93_local_cloud_profiles': 'preference-key',\n        'name': 'json', 'profile_$remembered':\
        \ 'preference-key',\n        'profile_${it.id}': 'preference-key', 'profile_name': 'json',\n \
        \       'profiles': 'json', 'user': 'protocol',\n    },\n    prefix+'features/home/MovioLandingScreen.kt':\
        \ {\n        'add':'protocol', 'logout':'protocol', 'switch':'protocol',\n    },\n    prefix+'features/more/MoreScreen.kt':\
        \ {'admin':'protocol'},\n    prefix+'features/shell/OwnTVShell.kt': {\n        'add':'protocol',\
        \ 'logout':'protocol', 'switch':'protocol',\n    },\n}\n# Do not classify arbitrary strings or\
        \ switch off the Gradle verifier.\n# Both source paths and actual literal values MUST match this\
        \ explicit manifest.\nentries={key:(count,categories[key]) for key,count in safe.items()}\naccepted=[]\n\
        for (path,literal),count in sorted(current.items()):\n    known=base.get((path,literal),0)+safe.get((path,literal),0)\n\
        \    if count<=known:\n        continue\n    group=reviewed.get(path,{})\n    if literal not in\
        \ group:\n        raise RuntimeError(f'NEW UNREVIEWED Kotlin literal: {path} {literal!r}; use\
        \ an Android string resource for UI text')\n    category=group[literal]\n    entries[(path,literal)]=(safe.get((path,literal),0)+(count-known),category)\n\
        \    accepted.append((path,literal))\nassert accepted, 'No newly classified protocol literals:\
        \ check V9.3 patch replay'\nmod.SAFE_MANIFEST.write_text(mod._serialize_safe(entries),encoding='utf8')\n\
        subprocess.run([sys.executable,str(scanner_path),'verify','--bootstrap'],check=True)\nprint('PASS:\
        \ V9.3 reviewed '+str(len(accepted))+' technical literal identifiers, all other text still gated')\n\
        PY_V93_SAFE"
    - name: 04B - AAPT2 compile generated Android strings BEFORE Kotlin (mandatory)
      shell: bash
      run: 'set -euo pipefail

        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

        test -d "$sdk/build-tools"

        aapt2="$(find "$sdk/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"

        test -x "$aapt2" || { echo ''Android AAPT2 compiler missing; fail closed''; exit 1; }

        test -s app/src/main/res/values/strings_moviotv_v93.xml

        mkdir -p "$RUNNER_TEMP/moviotv-v93-resource-check"

        "$aapt2" compile -o "$RUNNER_TEMP/moviotv-v93-resource-check" app/src/main/res/values/strings_moviotv_v93.xml

        find "$RUNNER_TEMP/moviotv-v93-resource-check" -type f -name ''*.flat'' | grep -q .

        echo ''PASS: Android AAPT2 resource compiler accepted generated V9.3 strings''

        '
    - name: 04C - Mandatory Kotlin compiler after Android resource checks
      shell: bash
      run: 'set -euo pipefail

        chmod +x ./gradlew

        ./gradlew -Powntv.corePath="$GITHUB_WORKSPACE/moviotv-core" :app:compileStandardDebugKotlin --no-daemon
        --stacktrace

        '
    - name: 05 - Lint, unit tests and debug APK assembly
      shell: bash
      run: 'set -euo pipefail

        ./gradlew -Powntv.corePath="$GITHUB_WORKSPACE/moviotv-core" lintStandardDebug testStandardDebugUnitTest
        assembleStandardDebug --no-daemon --stacktrace

        '
    - name: 06 - Verify actual APK, version, signature and fingerprint
      shell: bash
      run: 'set -euo pipefail

        apk=app/build/outputs/apk/standard/debug/app-standard-debug.apk

        test -s "$apk"

        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

        aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -n 1)"

        signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

        test -x "$aapt" && test -x "$signer"

        "$signer" verify "$apk"

        "$aapt" dump badging "$apk" > /tmp/moviotv-v93-badging.txt

        grep -F "name=''com.oakstudios.moviotv''" /tmp/moviotv-v93-badging.txt

        grep -F "versionCode=''100220''" /tmp/moviotv-v93-badging.txt

        grep -F "versionName=''9.3.0-qa7b''" /tmp/moviotv-v93-badging.txt

        mkdir -p dist

        cp "$apk" dist/MovioTV-v9.3.0-COMPLETE-QA7B-debug.apk

        sha256sum dist/*.apk > dist/SHA256SUMS.txt

        '
    - name: Upload QA APK (not a production-signed release)
      uses: actions/upload-artifact@v4
      with:
        name: MovioTV-V9.3-COMPLETE-QA7B-DEBUG
        path: 'dist/MovioTV-v9.3.0-COMPLETE-QA7B-debug.apk

          dist/SHA256SUMS.txt

          '
        retention-days: 30
        if-no-files-found: error
    - name: Report full Android Lint errors if build fails
      if: failure()
      shell: bash
      run: "set -euo pipefail\nreport=app/build/reports/lint-results-standardDebug.txt\nif [ -f \"$report\"\
        \ ]; then\n  echo '--- All Android lint errors ---'\n  grep -n -E '^.*: Error:' \"$report\" ||\
        \ true\n  echo '--- Lint summary ---'\n  tail -n 8 \"$report\" || true\nfi"
    - name: Collect failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: MovioTV-V9.3-QA7B-FAILURE-LOGS
        path: 'app/build/reports/tests/**

          app/build/reports/lint-results-*.html

          app/build/reports/lint-results-*.txt

          build/reports/problems/**

          '
        if-no-files-found: warn
