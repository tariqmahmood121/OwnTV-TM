        \ -m py_compile /tmp/moviotv_v93_complete_patch.py\npython3 /tmp/moviotv_v93_complete_patch.py\n\
        python3 - <<'PY_VERIFY'\nfrom pathlib import Path\nimport re\nimport xml.etree.ElementTree as\
        \ ET\nbase=Path('app/src/main/java/tv/own/owntv')\nsamples={\n   'features/setup/MovioCloudFirstRun.kt':\
