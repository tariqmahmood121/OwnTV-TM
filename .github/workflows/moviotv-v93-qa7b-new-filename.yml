name: MovioTV V9.3 QA7B - lint indentation and plurals fixes
run-name: 'MovioTV V9.3 QA7B - ${{ github.ref_name }} #${{ github.run_number }}'
'on':
  push:
    branches:
    - moviotv-v9
    paths:
    - .github/workflows/moviotv-v93-qa7b-new-filename.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: moviotv-v93-qa5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  v93-responsive-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      VERSION_NAME: 9.3.0-qa7b
      VERSION_CODE: '100220'
    steps:
    - name: Checkout existing V9 source
      uses: actions/checkout@v4
      with:
        ref: moviotv-v9
        fetch-depth: 0
    - name: Checkout exact upstream core from successful V9.2
      uses: actions/checkout@v4
      with:
        repository: ahXN00/OwnTV_Core
        ref: 0b60ef6d25e03a24193f1a5680cb239816fd8625
        path: moviotv-core
        persist-credentials: false
    - name: Checkout V8.1 patch baseline
      uses: actions/checkout@v4
      with:
        repository: tariqmahmood121/OwnTV-TM
        ref: feature/moviotv-v81-stability
        path: moviotv-v81-verified
        persist-credentials: false
    - name: 01 - Reconstruct verified V9.2 source, mapping, and regression checks
      shell: bash
      run: "set -euo pipefail\npython3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.2'\n\
        python3 - <<'PY_BASE'\nfrom pathlib import Path\nimport subprocess\nimport yaml\npath = Path('.github/workflows/moviotv-v92-full-qa-FIX3.yml')\n\
        assert path.is_file(), 'V9.2 FIX3 workflow not found. Do not build from an unknown baseline.'\n\
        doc = yaml.safe_load(path.read_text(encoding='utf-8'))\nsteps = doc['jobs']['v92-qa']['steps']\n\
        names = (\n    '01 - Replay full verified FIX3 source and automated prechecks',\n    '02A - Mandatory\
        \ generated-source mapping preflight BEFORE patch',\n    '02B - Apply V9.2 account, recovery and\
        \ handover changes',\n    '03 - V9.2 source regression preflight before compiler',\n)\nfor name\
        \ in names:\n    selected = [step for step in steps if step.get('name') == name and 'run' in step]\n\
        \    assert len(selected) == 1, 'Baseline step not found or changed: ' + name\n    print('RUN\
        \ VERIFIED BASELINE:', name, flush=True)\n    subprocess.run(['bash', '-e', '-u', '-o', 'pipefail',\
        \ '-c', selected[0]['run']], check=True)\nprint('PASS: Verified V9.2 source replay and regression\
        \ preflight', flush=True)\nPY_BASE\n"
    - name: 02 - Responsive More, Central, and Settings source patch
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/moviotv_v93_responsive_patch.py <<'PY_RESPONSIVE'\n#!/usr/bin/env\
        \ python3\n\"\"\"Fail-closed responsive navigation patch for MovioTV generated V9.2 QA sources.\n\
        \nRun *after* the V9.2 FIX3 source generation recipe, before compile.\nDesigned to preserve wide-screen\
        \ Android TV behavior and turn narrow More/Settings\nscreens into usable, full-width, independently\
        \ scrolling mobile pages.\n\"\"\"\nfrom pathlib import Path\n\nROOT = Path('app/src/main/java/tv/own/owntv')\n\
        more = ROOT / 'features/more/MoreScreen.kt'\nsettings = ROOT / 'features/settings/SettingsStage.kt'\n\
        \n\ndef load(path: Path) -> str:\n    if not path.is_file():\n        raise RuntimeError(f'RESPONSIVE\
        \ PRECHECK FAIL: Missing source {path}')\n    return path.read_text(encoding='utf-8')\n\n\ndef\
        \ one(source: str, before: str, after: str, where: str) -> str:\n    n = source.count(before)\n\
        \    if n != 1:\n        raise RuntimeError(f'RESPONSIVE PRECHECK FAIL: {where}: {n} matches,\
        \ expected 1: {before[:95]!r}')\n    return source.replace(before, after, 1)\n\n\nm = load(more)\n\
        assert 'MoreItem.CENTRAL' in m, 'Expected generated Central item; run V9.2 recipe first'\nassert\
        \ 'MoreItem.LOCAL_SYNC -> LocalSyncScreen' in m, 'Central mapping has changed'\n\nm = one(m, 'import\
        \ androidx.compose.foundation.background\\n',\n        'import androidx.compose.foundation.background\\\
        n'\n        'import androidx.compose.foundation.rememberScrollState\\n'\n        'import androidx.compose.foundation.verticalScroll\\\
        n'\n        'import androidx.compose.ui.platform.LocalConfiguration\\n'\n        'import androidx.compose.ui.unit.dp\\\
        n', 'More imports')\nm = one(m,\n        '    var chosen by rememberSaveable { mutableStateOf(MoreItem.SETTINGS)\
        \ }',\n        '''    var chosen by rememberSaveable { mutableStateOf(MoreItem.SETTINGS) }\n \
        \   // Narrow windows show one navigable panel at a time, including Central.\n    val compactLayout\
        \ = LocalConfiguration.current.screenWidthDp < 760\n    var compactDetailOpen by rememberSaveable\
        \ { mutableStateOf(false) }''',\n        'More compact state')\nm = one(m,\n        '    BackHandler(enabled\
        \ = pageFocused) { backToSheet() }',\n        '''    BackHandler(enabled = pageFocused && !compactLayout)\
        \ { backToSheet() }\n    BackHandler(enabled = compactLayout && compactDetailOpen) {\n       \
        \ compactDetailOpen = false\n        backToSheet()\n    }''', 'More back navigation')\nm = one(m,\n\
        \        '        Column(\\n            Modifier\\n                .padding(start = 24.mpx, top\
        \ = 24.mpx, bottom = 24.mpx)\\n                .width(440.mpx)\\n                .fillMaxHeight()',\n\
        \        '''        if (!compactLayout || !compactDetailOpen) Column(\n            Modifier\n\
        \                .padding(\n                    start = if (compactLayout) 8.mpx else 24.mpx,\n\
        \                    end = if (compactLayout) 8.mpx else 0.dp,\n                    top = if (compactLayout)\
        \ 148.mpx else 24.mpx,\n                    bottom = if (compactLayout) 20.mpx else 24.mpx,\n\
        \                )\n                .then(if (compactLayout) Modifier.fillMaxWidth() else Modifier.width(440.mpx))\n\
        \                .fillMaxHeight()''',\n        'More sidebar layout')\nm = one(m,\n        ' \
        \               .padding(horizontal = 16.mpx, vertical = 26.mpx)\\n                // ◀ back',\n\
        \        '''                .padding(\n                    horizontal = if (compactLayout) 8.mpx\
        \ else 16.mpx,\n                    vertical = if (compactLayout) 12.mpx else 26.mpx,\n      \
        \          )\n                .then(if (compactLayout) Modifier.verticalScroll(rememberScrollState())\
        \ else Modifier)\n                // ◀ back''', 'More menu scrolling')\nm = one(m,\n        '\
        \                    onClick = { choose(it) },',\n        '''                    onClick = {\n\
        \                        choose(it)\n                        if (compactLayout && !pinShut(it))\
        \ compactDetailOpen = true\n                    },''', 'More item selection')\nm = one(m,\n  \
        \      '            Spacer(Modifier.weight(1f))',\n        '            if (!compactLayout) Spacer(Modifier.weight(1f))',\n\
        \        'More compact scroll spacer')\nm = one(m,\n        '        Box(\\n            Modifier\\\
        n                .padding(start = 520.mpx, top = 128.mpx, end = 64.mpx)',\n        '''       \
        \ if (!compactLayout || compactDetailOpen) Box(\n            Modifier\n                .padding(\n\
        \                    start = if (compactLayout) 14.mpx else 520.mpx,\n                    top\
        \ = if (compactLayout) 148.mpx else 128.mpx,\n                    end = if (compactLayout) 14.mpx\
        \ else 64.mpx,\n                    bottom = if (compactLayout) 12.mpx else 0.dp,\n          \
        \      )''', 'More detail layout')\n# Central/About have their own Back handlers; they must close\
        \ the compact detail,\n# not merely move D-pad focus behind an invisible sidebar.\nm = one(m,\n\
        \        'MovioCentralScreen(onBack = backToSheet, modifier = Modifier.fillMaxSize().focusRequester(pageTarget).focusGroup())',\n\
        \        'MovioCentralScreen(onBack = { if (compactLayout) compactDetailOpen = false else backToSheet()\
        \ }, modifier = Modifier.fillMaxSize().focusRequester(pageTarget).focusGroup())',\n        'Central\
        \ compact back')\nm = one(m,\n        'MovioAboutScreen(onBack = aboutBack, modifier = Modifier.fillMaxSize().focusRequester(pageTarget).focusGroup())',\n\
        \        'MovioAboutScreen(onBack = { if (compactLayout) compactDetailOpen = false else aboutBack()\
        \ }, modifier = Modifier.fillMaxSize().focusRequester(pageTarget).focusGroup())',\n        'About\
        \ compact back')\nm = one(m,\n        'onUnlock = { pinPagesUnlocked = true; askPinFor = null;\
        \ chosen = pinItem; pageEntry = null }',\n        'onUnlock = { pinPagesUnlocked = true; askPinFor\
        \ = null; chosen = pinItem; pageEntry = null; if (compactLayout) compactDetailOpen = true }',\n\
        \        'More PIN navigation')\n\ns = load(settings)\ns = one(s, 'import androidx.compose.foundation.verticalScroll\\\
        n',\n        'import androidx.compose.foundation.verticalScroll\\nimport androidx.compose.ui.unit.dp\\\
        n',\n        'Settings imports')\ns = one(s,\n        '            val w = maxWidth / 1920f\\\
        n            Row(',\n        '''            val w = maxWidth / 1920f\n            val compact\
        \ = maxWidth < 760.dp\n            if (compact) {\n                Column(Modifier.fillMaxWidth().padding(horizontal\
        \ = 14.dp, vertical = 10.dp),\n                    verticalArrangement = Arrangement.spacedBy(8.dp))\
        \ {\n                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically)\
        \ {\n                        Text(group, style = stageText(25, 800), color = StageColors.Text,\n\
        \                            maxLines = 2, overflow = TextOverflow.Ellipsis,\n               \
        \             modifier = Modifier.weight(1f))\n                        Text(count, style = stageText(14,\
        \ 600), color = StageColors.Dim)\n                    }\n                    if (tools != null)\
        \ Row(horizontalArrangement = Arrangement.spacedBy(8.dp), content = tools)\n                 \
        \   if (showSearch) StageSearchField(\n                        query = searchQuery, onQueryChange\
        \ = onSearchQuery,\n                        placeholder = stringResource(R.string.more_settings_search),\n\
        \                        modifier = Modifier.fillMaxWidth().focusRequester(searchFocus),\n   \
        \                     height = 46.dp, radius = 16.dp, horizontalPadding = 12.dp,\n           \
        \             autoEdit = searchAutoEdit, onActivate = onSearchActivate,\n                    )\n\
        \                }\n            }\n            if (!compact) Row(''', 'Settings compact header')\n\
        s = one(s,\n        '            val rowsTop = if (toolbar != null) 300.mpx else 210.mpx',\n \
        \       '            val rowsTop = if (compact) (if (toolbar != null) 172.dp else 124.dp) else\
        \ if (toolbar != null) 300.mpx else 210.mpx',\n        'Settings rows top')\ns = one(s,\n    \
        \    'Modifier.padding(start = w * 50, top = 210.mpx).width(w * 1060).height(84.mpx)',\n     \
        \   'Modifier.padding(start = if (compact) 14.dp else w * 50, top = if (compact) 124.dp else 210.mpx).width(if\
        \ (compact) maxWidth - 28.dp else w * 1060).height(if (compact) 44.dp else 84.mpx)',\n       \
        \ 'Settings tools sizing')\ns = one(s,\n        'if (list != null) list(Modifier.padding(start\
        \ = w * 50, top = rowsTop).width(w * 1060).fillMaxHeight())',\n        'if (list != null) list(Modifier.padding(start\
        \ = if (compact) 14.dp else w * 50, top = rowsTop).width(if (compact) maxWidth - 28.dp else w\
        \ * 1060).fillMaxHeight())',\n        'Settings list sizing')\ns = one(s,\n        '.padding(start\
        \ = w * 50, top = rowsTop)\\n                        .width(w * 1060)',\n        '.padding(start\
        \ = if (compact) 14.dp else w * 50, top = rowsTop)\\n                        .width(if (compact)\
        \ maxWidth - 28.dp else w * 1060)',\n        'Settings row column sizing')\ns = one(s,\n     \
        \   '.padding(start = w * 1160, top = 240.mpx)\\n                        .width(w * 696)\\n  \
        \                      .heightIn(max = maxHeight - 280.mpx)',\n        '''.padding(start = if\
        \ (compact) 14.dp else w * 1160,\n                            top = if (compact) 124.dp else 240.mpx)\n\
        \                        .width(if (compact) maxWidth - 28.dp else w * 696)\n                \
        \        .heightIn(max = if (compact) (maxHeight - 140.dp).coerceAtLeast(120.dp) else maxHeight\
        \ - 280.mpx)''',\n        'Settings help overlay')\n\n# The row component is isolated before editing;\
        \ similar Row/padding fragments are\n# repeated in unrelated settings components and must NEVER\
        \ be globally replaced.\nstart = s.index('fun StageSettingRow(')\nend = s.index('private val FocusedDesc',\
        \ start)\nhead, body, tail = s[:start], s[start:end], s[end:]\nbody = one(body,\n        '   \
        \ val panel = LocalSettingsPanel.current\\n    var longAt',\n        '    val panel = LocalSettingsPanel.current\\\
        n    val compactRow = androidx.compose.ui.platform.LocalConfiguration.current.screenWidthDp <\
        \ 760\\n    var longAt',\n        'StageSettingRow compact state')\nbody = one(body,\n       \
        \ '.height(84.mpx)\\n            .then(\\n                if (onStep != null)',\n        '.height(if\
        \ (compactRow) 124.mpx else 84.mpx)\\n            .then(\\n                if (onStep != null)',\n\
        \        'StageSettingRow height')\nbody = one(body,\n        '            Modifier.fillMaxWidth().padding(horizontal\
        \ = 22.mpx),\\n            horizontalArrangement = Arrangement.spacedBy(18.mpx),',\n        '\
        \            Modifier.fillMaxWidth().padding(horizontal = if (compactRow) 10.mpx else 22.mpx),\\\
        n            horizontalArrangement = Arrangement.spacedBy(if (compactRow) 10.mpx else 18.mpx),',\n\
        \        'StageSettingRow spacing')\nbody = one(body,\n        'Text(title, style = stageText(21,\
        \ 700), color = if (enabled) StageColors.Text else StageColors.Dim, maxLines = 1, overflow = TextOverflow.Ellipsis',\n\
        \        'Text(title, style = stageText(21, 700), color = if (enabled) StageColors.Text else StageColors.Dim,\
        \ maxLines = if (compactRow) 2 else 1, overflow = TextOverflow.Ellipsis',\n        'StageSettingRow\
        \ title')\nbody = one(body,\n        'desc, style = stageText(15.5f, 500),\\n                \
        \        color = if (focused) FocusedDesc else StageColors.Muted,\\n                        maxLines\
        \ = 1',\n        'desc, style = stageText(15.5f, 500),\\n                        color = if (focused)\
        \ FocusedDesc else StageColors.Muted,\\n                        maxLines = if (compactRow) 2 else\
        \ 1',\n        'StageSettingRow description')\nbody = one(body,\n        '                }\\\
        n            }\\n            if (value != null) SettingValueView(value)\\n        }\\n    }\\\
        n}\\n\\n',\n        '                }\\n                if (compactRow && value != null) SettingValueView(value)\\\
        n            }\\n            if (!compactRow && value != null) SettingValueView(value)\\n    \
        \    }\\n    }\\n}\\n\\n',\n        'StageSettingRow value')\ns = head + body + tail\n\n# The\
        \ More > Settings landing page also hard-codes three cards per row. On a\n# portrait phone this\
        \ truncates every title even after the detail pane is fixed.\nmore_pages = ROOT / 'features/more/MorePages.kt'\n\
        pages = load(more_pages)\npages = one(pages,\n    'import androidx.compose.foundation.background\\\
        n',\n    'import androidx.compose.foundation.background\\nimport androidx.compose.foundation.rememberScrollState\\\
        nimport androidx.compose.foundation.verticalScroll\\n',\n    'MorePages imports')\nstart = pages.index('internal\
        \ fun SettingsPage(')\nend = pages.index('private enum class FavFilter', start)\nintro, cards,\
        \ outro = pages[:start], pages[start:end], pages[end:]\ncards = one(cards,\n    '    val back\
        \ = lastOpenedCard',\n    '    val compact = androidx.compose.ui.platform.LocalConfiguration.current.screenWidthDp\
        \ < 760\\n    val back = lastOpenedCard',\n    'Settings card compact state')\ncards = one(cards,\n\
        \    '    Column(Modifier.fillMaxSize().focusGroup()) {',\n    '    Column(Modifier.fillMaxSize().then(if\
        \ (compact) Modifier.verticalScroll(rememberScrollState()) else Modifier).focusGroup()) {',\n\
        \    'Settings card scroll')\ncards = one(cards,\n    'SettingsCards.chunked(3).forEach { row\
        \ ->',\n    'SettingsCards.chunked(if (compact) 1 else 3).forEach { row ->',\n    'Settings card\
        \ columns')\ncards = one(cards,\n    'Row(Modifier.height(IntrinsicSize.Min), horizontalArrangement\
        \ = Arrangement.spacedBy(20.mpx)) {',\n    'Row(Modifier.fillMaxWidth().height(IntrinsicSize.Min),\
        \ horizontalArrangement = Arrangement.spacedBy(20.mpx)) {',\n    'Settings card row sizing')\n\
        cards = one(cards,\n    'Text(stringResource(card.nameRes), style = stageText(24, 800), color\
        \ = StageColors.Text, maxLines = 1,',\n    'Text(stringResource(card.nameRes), style = stageText(24,\
        \ 800), color = StageColors.Text, maxLines = if (compact) 2 else 1,',\n    'Settings card titles')\n\
        cards = one(cards,\n    'Text(stringResource(card.summaryRes), style = stageText(16, 500), color\
        \ = StageColors.Muted, maxLines = 1,',\n    'Text(stringResource(card.summaryRes), style = stageText(16,\
        \ 500), color = StageColors.Muted, maxLines = if (compact) 2 else 1,',\n    'Settings card descriptions')\n\
        pages = intro + cards + outro\n\n# Never partially write: all preflight anchors and key V9 identifiers\
        \ are checked first.\nfor path, source in ((more, m), (settings, s), (more_pages, pages)):\n \
        \   if source.count('{') != source.count('}'):\n        raise RuntimeError(f'RESPONSIVE PRECHECK\
        \ FAIL: unmatched braces: {path}')\nif 'MoreItem.CENTRAL' not in m or 'compactDetailOpen' not\
        \ in m or 'compactRow' not in s:\n    raise RuntimeError('RESPONSE PRECHECK FAIL: key screens\
        \ not transformed')\nmore.write_text(m, encoding='utf-8')\nsettings.write_text(s, encoding='utf-8')\n\
        more_pages.write_text(pages, encoding='utf-8')\nprint('RESPONSIVE STATIC PRECHECK PASS: More/Central\
        \ menus, shared Settings widths and one-column mobile cards adapted')\nprint('NEXT: actual Kotlin\
        \ compilation, Android lint, unit tests and device testing are mandatory')\nPY_RESPONSIVE\npython3\
        \ -m py_compile /tmp/moviotv_v93_responsive_patch.py\npython3 /tmp/moviotv_v93_responsive_patch.py\n"
    - name: 03 - Ratchet resource and generated Kotlin checks
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY_RATCHET''

        import subprocess

        from pathlib import Path

        import yaml

        source = yaml.safe_load(Path(''.github/workflows/moviotv-v92-full-qa-FIX3.yml'').read_text(encoding=''utf-8''))

        name = ''04 - Mandatory i18n ratchet with V9.2 empty-literal review before Kotlin''

        steps = [s for s in source[''jobs''][''v92-qa''][''steps''] if s.get(''name'') == name]

        assert len(steps) == 1

        subprocess.run([''bash'', ''-e'', ''-u'', ''-o'', ''pipefail'', ''-c'', steps[0][''run'']], check=True)

        print(''PASS: Original V9.2 i18n checks after responsive patch'')

        PY_RATCHET

        '
    - name: 04 - Apply full V9.3 fixes with both QA6 lint regressions corrected
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/moviotv_v93_complete_patch.py <<'PY_COMPLETE'\n#!/usr/bin/env\
        \ python3\n\"\"\"MovioTV V9.3 QA: fail-closed patch for V9.2 generated source (after responsive\
        \ patch).\n\nThis script does not modify the verified build branch. The one-file workflow uses\
        \ it\nin the temporary GitHub Actions checkout, after V9.2 FIX3 assembly and checks.\n\"\"\"\n\
        from pathlib import Path\nimport re\nimport textwrap\nimport xml.etree.ElementTree as ET\n\nBASE\
        \ = Path('app/src/main/java/tv/own/owntv')\nRES = Path('app/src/main/res/values')\nSOURCES = {}\n\
        \n\ndef source(name):\n    p = BASE / name\n    if not p.is_file():\n        raise RuntimeError(f'PRECHECK:\
        \ generated source missing: {p}')\n    return p\n\n\ndef read(name):\n    p = source(name)\n \
        \   return SOURCES.get(p, p.read_text(encoding='utf-8'))\n\n\ndef one(content, before, after,\
        \ description):\n    num = content.count(before)\n    if num != 1:\n        raise RuntimeError(f'PRECHECK\
        \ FAIL {description}: expected one anchor; got {num}: {before[:120]!r}')\n    return content.replace(before,\
        \ after, 1)\n\n\ndef regex_one(content, pattern, replacement, description):\n    matches = list(re.finditer(pattern,\
        \ content, flags=re.S | re.M))\n    if len(matches) != 1:\n        raise RuntimeError(f'PRECHECK\
        \ FAIL {description}: expected precisely one pattern; got {len(matches)}')\n    return re.sub(pattern,\
        \ replacement, content, count=1, flags=re.S | re.M)\n\n\ndef stage(name, body):\n    SOURCES[source(name)]\
        \ = body\n\n\n# 1. WIZARD — make the currently running check readable at all times.\ncloud_name\
        \ = 'features/setup/MovioCloudFirstRun.kt'\ncloud = read(cloud_name)\nassert cloud.count('steps.forEachIndexed\
        \ { index, item ->') == 1, 'Expected the V8.4.3 generated eight-step wizard'\nassert cloud.count('MovioV9CatalogueActivity()')\
        \ == 1, 'Expected V9 real catalogue counters'\ncloud = one(cloud, 'if (stage >= 5) MovioV9CatalogueActivity()\\\
        n', '', 'Remove misplaced catalogue counters')\ncloud = one(cloud,\n    '            Box(Modifier.fillMaxWidth().height(9.dp)',\n\
        \    '''            // The active operation must always sit immediately above overall progress.\n\
        \            Text(stringResource(R.string.moviotv_v93_current_check),\n                style =\
        \ stageText(14, 700), color = Color(0xFFC89BFF))\n            Text(steps[stage.coerceIn(0, steps.lastIndex)],\n\
        \                style = stageText(19, 700), color = StageColors.Text,\n                maxLines\
        \ = 3, modifier = Modifier.fillMaxWidth().padding(bottom = 7.dp))\n            Box(Modifier.fillMaxWidth().height(9.dp)''',\
        \ 'Current check before bar')\n# Don't tell the user setup is 100% before verification and leaving\
        \ the wizard.\ncloud = one(cloud,\n    '((stage.coerceIn(0,7) + 1).toFloat() / 8f)',\n    '(stage.coerceIn(0,7).toFloat()\
        \ / 8f)', 'Honest overall progress')\n# Remove the eight always-on labels. They are precisely\
        \ what overlaid at 12:19.\n# V9.1 wraps the original eight phone labels AND eight TV labels in\
        \ a responsive\n# BoxWithConstraints. Remove the ENTIRE container: otherwise TV still overlaps.\n\
        step_start = '            BoxWithConstraints(Modifier.fillMaxWidth()) {'\nif cloud.count(step_start)\
        \ != 1:\n    raise RuntimeError(f'Wizard stage container moved: {cloud.count(step_start)} matches')\n\
        i = cloud.index(step_start)\nopening = cloud.index('{', i)\ndepth = 0\nfinish = None\nfor j in\
        \ range(opening, len(cloud)):\n    if cloud[j] == '{':\n        depth += 1\n    elif cloud[j]\
        \ == '}':\n        depth -= 1\n        if depth == 0:\n            finish = j + 1\n          \
        \  break\nif finish is None or 'steps.forEachIndexed' not in cloud[i:finish]:\n    raise RuntimeError('Cannot\
        \ isolate all overlapping stage labels in wizard')\ncloud = cloud[:i] + '''            if (stage\
        \ >= 5) MovioV9CatalogueActivity()\n            Text(stringResource(R.string.moviotv_v93_completed_checks,\
        \ stage.coerceIn(0,7)),\n                style = stageText(13, 500), color = StageColors.Muted)'''\
        \ + cloud[finish:]\nif 'steps.forEachIndexed' in cloud:\n    raise RuntimeError('Overlapping stage-list\
        \ renderer remains')\n# First-run Cloud sign-in also refreshes the account role; otherwise legacy\n\
        # users stay stuck on the conservative UI default until they visit Central.\ncloud = one(cloud,\
        \ 'api.signIn(username, password)',\n    'api.signIn(username, password)\\n                  \
        \      try { api.refreshUiRole() } catch (_: Exception) { /* Keep conservative UI until Central\
        \ is reachable */ }',\n    'Refresh role during cloud-first provisioning')\nstage(cloud_name,\
        \ cloud)\n\n# Actual Room-backed counts, laid out side-by-side with category icons.\ncounts_name\
        \ = 'features/setup/MovioV9CatalogueActivity.kt'\nif not source(counts_name).is_file():\n    raise\
        \ RuntimeError('Missing V9 flow-backed Room counter widget')\noriginal_counter = read(counts_name)\n\
        for anchor in ('sourceDao().observeAll()', 'movieDao().countAll(ids)', 'seriesDao().countAll(ids)',\
        \ 'channelDao().countAll(ids)'):\n    if anchor not in original_counter:\n        raise RuntimeError('Room\
        \ catalogue flow mapping changed: ' + anchor)\nnew_counter = '''package tv.own.owntv.features.setup\n\
        \nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.layout.Arrangement\n\
