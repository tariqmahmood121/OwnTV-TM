name: MovioXP simulator navigation device test

on:
  push:
    branches: [movioxp-v4-cinema-i]
    paths-ignore:
      - docs/movioxp-v4-i-review.md
      - .github/workflows/movioxp-v4-i-reviewed-release.yml
      - .github/workflows/movioxp-simulation-device-test.yml
  workflow_dispatch:
    inputs:
      visual_verified:
        description: Required visual acceptance screenshots were reviewed for this commit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOVIOXP_RELEASE: 'true'
      VERSION_NAME: '4.0 I'
      VERSION_CODE: '100106'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate Android sources and compile debug tests
        run: |
          python3 tools/i18n/check_hardcoded_strings.py verify --bootstrap
          bash gradlew :app:testX86_64DebugUnitTest :app:assembleX86_64DebugAndroidTest --stacktrace
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tools/capture-cinema-emulator.sh
      - name: Show emulator test failures
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree
          for report in Path("app/build/outputs/androidTest-results").rglob("TEST-*.xml"):
              for case in ElementTree.parse(report).iter("testcase"):
                  for error in list(case.findall("failure")) + list(case.findall("error")):
                      print(case.attrib.get("name"), error.attrib.get("message", ""))
                      print((error.text or "")[:6000])
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulation-test-results
          path: cinema-instrumentation.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cinema-visual
          path: cinema-visual/

  signed-qa:
    if: github.ref_name == 'movioxp-v4-cinema-i' && inputs.visual_verified == true
    needs: emulator
    permissions:
      contents: write
    uses: ./.github/workflows/movioxp-central-isolation-release.yml
    with:
      device_test_passed: true
    secrets: inherit
