name: MovioXP simulator navigation device test

on:
  push:
    branches: [movioxp-v4-simulation-corrections]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOVIOXP_RELEASE: 'true'
      VERSION_NAME: '4.0 E'
      VERSION_CODE: '100102'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate Android sources and compile debug tests
        run: |
          python3 tools/i18n/check_hardcoded_strings.py verify --bootstrap
          bash gradlew :app:testX86_64DebugUnitTest :app:assembleX86_64DebugAndroidTest --stacktrace
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash gradlew :app:connectedX86_64DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=tv.own.owntv.features.simulation.XpSimulationRemoteTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulation-test-results
          path: app/build/outputs/androidTest-results/
