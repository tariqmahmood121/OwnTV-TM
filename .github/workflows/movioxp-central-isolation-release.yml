name: MovioXP Built-in Discover Home categories - signed release QA

on:
  push:
    branches:
      - fix/movioxp-central-profile-isolation-release
      - feature/movioxp-profile-library-v80
      - feature/movioxp-central-account-zoom-v81
      - feature/movioxp-discover-v82
      - feature/movioxp-qa5
      - feature/movioxp-qa6
      - release/movioxp-3.0.0
      - feature/movioxp-v3.1-profile-updater
      - feature/movioxp-v3.1-qa2
      - qa/movioxp-android-refresh
      - movioxp-v4
      - movioxp-v4-cinema
      - movioxp-v4-cinema-polish
      - movioxp-v4-tv-simulation
  workflow_dispatch:
  workflow_call:
    inputs:
      device_test_passed:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  signed-release:
    if: (github.ref_name != 'movioxp-v4-simulation-corrections' && github.ref_name != 'movioxp-v4-cinema-navigation' && github.ref_name != 'movioxp-v4-home-grid' && github.ref_name != 'movioxp-v4-feature-cache' && github.ref_name != 'movioxp-v4-cinema-i' && github.ref_name != 'movioxp-v4-cinema-j') || inputs.device_test_passed == true
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out fixed MovioXP branch
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate translation inventory and Android values
        run: |
          python3 tools/i18n/check_hardcoded_strings.py verify --bootstrap
          python3 - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree
          for resource in Path("app/src/main/res").glob("values*/*.xml"):
              ElementTree.parse(resource)
          PYTHON

      - name: Check Central mobile login syntax
        if: github.ref_name == 'feature/movioxp-v3.1-qa2'
        run: |
          set -euo pipefail
          find central-deployment/mobile-login -name '*.php' -print0 | xargs -0 -r -n1 php -l
          node --check central-deployment/mobile-login/public/movio/api/mobile-login/connect.js

      - name: Decode dedicated MovioXP release keystore
        env:
          MOVIOXP_KEYSTORE_BASE64: ${{ secrets.MOVIOXP_KEYSTORE_BASE64 }}
          MOVIOXP_KEYSTORE_PASSWORD: ${{ secrets.MOVIOXP_KEYSTORE_PASSWORD }}
          MOVIOXP_KEY_ALIAS: ${{ secrets.MOVIOXP_KEY_ALIAS }}
          MOVIOXP_KEY_PASSWORD: ${{ secrets.MOVIOXP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MOVIOXP_KEYSTORE_BASE64 MOVIOXP_KEYSTORE_PASSWORD MOVIOXP_KEY_ALIAS MOVIOXP_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required MovioXP signing secret $name is missing; refusing to produce an unsigned APK."
              exit 1
            fi
          done
          printf '%s' "$MOVIOXP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/movioxp-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/movioxp-release.jks" >> "$GITHUB_ENV"
          echo "Release keystore prepared."

      - name: Unit tests and signed release APK
        env:
          MOVIOXP_RELEASE: 'true'
          VERSION_CODE: ${{ github.ref_name == 'movioxp-v4-cinema-j' && '100107' || github.ref_name == 'movioxp-v4-cinema-i' && '100106' || github.ref_name == 'movioxp-v4-feature-cache' && '100105' || github.ref_name == 'movioxp-v4-home-grid' && '100104' || github.ref_name == 'movioxp-v4-cinema-navigation' && '100103' || github.ref_name == 'movioxp-v4-simulation-corrections' && '100102' || github.ref_name == 'movioxp-v4-tv-simulation' && '100101' || github.ref_name == 'movioxp-v4-cinema-polish' && '100100' || github.ref_name == 'movioxp-v4-cinema' && '100099' || github.ref_name == 'movioxp-v4' && '100098' || github.ref_name == 'qa/movioxp-android-refresh' && '100097' || github.ref_name == 'feature/movioxp-v3.1-qa2' && '100093' || github.ref_name == 'feature/movioxp-v3.1-profile-updater' && '100090' || github.ref_name == 'release/movioxp-3.0.0' && '100089' || github.ref_name == 'feature/movioxp-qa6' && '100088' || '100087' }}
          VERSION_NAME: ${{ github.ref_name == 'movioxp-v4-cinema-j' && '4.0 J' || github.ref_name == 'movioxp-v4-cinema-i' && '4.0 I' || github.ref_name == 'movioxp-v4-feature-cache' && '4.0 H' || github.ref_name == 'movioxp-v4-home-grid' && '4.0 G' || github.ref_name == 'movioxp-v4-cinema-navigation' && '4.0 F' || github.ref_name == 'movioxp-v4-simulation-corrections' && '4.0 E' || github.ref_name == 'movioxp-v4-tv-simulation' && '4.0 D' || github.ref_name == 'movioxp-v4-cinema-polish' && '4.0 C' || github.ref_name == 'movioxp-v4-cinema' && '4.0 B' || github.ref_name == 'movioxp-v4' && '4.0 A' || github.ref_name == 'qa/movioxp-android-refresh' && '3.1.0-qa6' || github.ref_name == 'feature/movioxp-v3.1-qa2' && '3.1.0-qa2.1' || github.ref_name == 'feature/movioxp-v3.1-profile-updater' && '3.1.0-qa1' || github.ref_name == 'release/movioxp-3.0.0' && '3.0.0' || github.ref_name == 'feature/movioxp-qa6' && '1.0.86-qa6' || '1.0.85-qa5' }}
          KEYSTORE_PASSWORD: ${{ secrets.MOVIOXP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOVIOXP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOVIOXP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testStandardDebugUnitTest :app:assembleStandardRelease --stacktrace
          test -n "$(find app/build/outputs/apk/standard/release -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Verify release APK signing
        env:
          VERSION_CODE: ${{ github.ref_name == 'movioxp-v4-cinema-j' && '100107' || github.ref_name == 'movioxp-v4-cinema-i' && '100106' || github.ref_name == 'movioxp-v4-feature-cache' && '100105' || github.ref_name == 'movioxp-v4-home-grid' && '100104' || github.ref_name == 'movioxp-v4-cinema-navigation' && '100103' || github.ref_name == 'movioxp-v4-simulation-corrections' && '100102' || github.ref_name == 'movioxp-v4-tv-simulation' && '100101' || github.ref_name == 'movioxp-v4-cinema-polish' && '100100' || github.ref_name == 'movioxp-v4-cinema' && '100099' || github.ref_name == 'movioxp-v4' && '100098' || github.ref_name == 'qa/movioxp-android-refresh' && '100097' || github.ref_name == 'feature/movioxp-v3.1-qa2' && '100093' || github.ref_name == 'feature/movioxp-v3.1-profile-updater' && '100090' || github.ref_name == 'release/movioxp-3.0.0' && '100089' || github.ref_name == 'feature/movioxp-qa6' && '100088' || '100087' }}
          VERSION_NAME: ${{ github.ref_name == 'movioxp-v4-cinema-j' && '4.0 J' || github.ref_name == 'movioxp-v4-cinema-i' && '4.0 I' || github.ref_name == 'movioxp-v4-feature-cache' && '4.0 H' || github.ref_name == 'movioxp-v4-home-grid' && '4.0 G' || github.ref_name == 'movioxp-v4-cinema-navigation' && '4.0 F' || github.ref_name == 'movioxp-v4-simulation-corrections' && '4.0 E' || github.ref_name == 'movioxp-v4-tv-simulation' && '4.0 D' || github.ref_name == 'movioxp-v4-cinema-polish' && '4.0 C' || github.ref_name == 'movioxp-v4-cinema' && '4.0 B' || github.ref_name == 'movioxp-v4' && '4.0 A' || github.ref_name == 'qa/movioxp-android-refresh' && '3.1.0-qa6' || github.ref_name == 'feature/movioxp-v3.1-qa2' && '3.1.0-qa2.1' || github.ref_name == 'feature/movioxp-v3.1-profile-updater' && '3.1.0-qa1' || github.ref_name == 'release/movioxp-3.0.0' && '3.0.0' || github.ref_name == 'feature/movioxp-qa6' && '1.0.86-qa6' || '1.0.85-qa5' }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/standard/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          [ -n "$SDK_APKSIGNER" ] || { echo "::error::apksigner missing"; exit 1; }
          "$SDK_APKSIGNER" verify "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          [ -n "$AAPT" ] || { echo "::error::aapt missing"; exit 1; }
          BADGING=$("$AAPT" dump badging "$APK")
          [[ "$BADGING" == *"name='com.oakstudios.movioxp'"* ]] || { echo "::error::Package mismatch"; exit 1; }
          [[ "$BADGING" == *"versionCode='$VERSION_CODE'"* ]] || { echo "::error::Version code mismatch"; exit 1; }
          [[ "$BADGING" == *"versionName='$VERSION_NAME'"* ]] || { echo "::error::Version name mismatch"; exit 1; }
          mkdir -p dist
          if [ "$VERSION_NAME" = '4.0 J' ]; then
            cp "$APK" dist/MovioXP-4.0-J.apk
          elif [ "$VERSION_NAME" = '4.0 I' ]; then
            cp "$APK" dist/MovioXP-4.0-I.apk
          elif [ "$VERSION_NAME" = '4.0 H' ]; then
            cp "$APK" dist/MovioXP-4.0-H.apk
          elif [ "$VERSION_NAME" = '4.0 G' ]; then
            cp "$APK" dist/MovioXP-4.0-G.apk
          elif [ "$VERSION_NAME" = '4.0 F' ]; then
            cp "$APK" dist/MovioXP-4.0-F.apk
          elif [ "$VERSION_NAME" = '4.0 E' ]; then
            cp "$APK" dist/MovioXP-4.0-E.apk
          elif [ "$VERSION_NAME" = '4.0 D' ]; then
            cp "$APK" dist/MovioXP-4.0-D.apk
          elif [ "$VERSION_NAME" = '4.0 C' ]; then
            cp "$APK" dist/MovioXP-4.0-C.apk
          elif [ "$VERSION_NAME" = '4.0 B' ]; then
            cp "$APK" dist/MovioXP-4.0-B.apk
          elif [ "$VERSION_NAME" = '4.0 A' ]; then
            cp "$APK" dist/MovioXP-4.0-A.apk
          else
            cp "$APK" "dist/MovioXP-${VERSION_NAME}-discover-home-release.apk"
          fi
          # Produce a matching update manifest; publication to Plesk is deliberately MANUAL.
          # QA APK must never overwrite the existing stable /downloads/movioxp.apk.
          python3 - <<'PYMANIFEST'
          import hashlib, json, os, pathlib
          version = os.environ["VERSION_NAME"]
          experimental = version in {"4.0 A", "4.0 B", "4.0 C", "4.0 D", "4.0 E", "4.0 F", "4.0 G", "4.0 H", "4.0 I", "4.0 J"}
          filename = pathlib.Path("dist/MovioXP-" + version.replace(" ", "-") + ".apk" if experimental else "dist/MovioXP-" + version + "-discover-home-release.apk")
          qa = experimental or "-qa" in version
          result = {
              "app": "MovioXP",
              "packageName": "com.oakstudios.movioxp",
              "versionName": version,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "channel": "qa" if qa else "stable",
              "apkUrl": "https://moviotv.opticalzoo.com/downloads/qa/movioxp.apk" if qa else "https://moviotv.opticalzoo.com/downloads/movioxp.apk",
              "apkSizeBytes": filename.stat().st_size,
              "sha256": hashlib.sha256(filename.read_bytes()).hexdigest(),
              "releaseNotes": (
                  "Final Cinema refinements"
                  if version == "4.0 J"
                  else "Cinema rotation and catalogue navigation"
                  if version == "4.0 I"
                  else "Cache-first cinematic Home"
                  if version == "4.0 H"
                  else "Cinematic Home and full category browsing"
                  if version == "4.0 G"
                  else "Cinema experience and navigation refinement"
                  if version == "4.0 F"
                  else "Cinema and simulator corrections"
                  if version == "4.0 E"
                  else "TV Simulation"
                  if version == "4.0 D"
                  else "Cinema Polish"
                  if version == "4.0 C"
                  else "Cinema Interface"
                  if version == "4.0 B"
                  else "Experimental Edition"
                  if experimental
                  else "Compact browsing, visible phone-entry PIN, local card sizing and playback controls."
                  if version == "3.1.0-qa6"
                  else
                  "Android 17 startup crash repair. Includes account confirmation and mobile QR sign-in."
                  if version == "3.1.0-qa2.1"
                  else "MovioXP 3.1: larger profile and LED, accessible account menu, responsive navigation and secure software updates."
              ),
              "publishedAt": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "minSupportedVersionCode": 1
          }
          pathlib.Path("dist/movioxp-version.json").write_text(json.dumps(result, indent=2)+"\n")
          print("Update manifest generated for", result["channel"], "version", version)
          PYMANIFEST
          if [ "$VERSION_NAME" = '4.0 C' ]; then
            zip -j dist/MovioXP-4.0-C-release.zip dist/MovioXP-4.0-C.apk dist/movioxp-version.json
            unzip -t dist/MovioXP-4.0-C-release.zip
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: MovioXP-${{ github.ref_name == 'movioxp-v4-cinema-j' && '4.0 J' || github.ref_name == 'movioxp-v4-cinema-i' && '4.0 I' || github.ref_name == 'movioxp-v4-feature-cache' && '4.0 H' || github.ref_name == 'movioxp-v4-home-grid' && '4.0 G' || github.ref_name == 'movioxp-v4-cinema-navigation' && '4.0 F' || github.ref_name == 'movioxp-v4-simulation-corrections' && '4.0 E' || github.ref_name == 'movioxp-v4-tv-simulation' && '4.0 D' || github.ref_name == 'movioxp-v4-cinema-polish' && '4.0 C' || github.ref_name == 'movioxp-v4-cinema' && '4.0 B' || github.ref_name == 'movioxp-v4' && '4.0 A' || github.ref_name == 'qa/movioxp-android-refresh' && '3.1.0-qa6' || github.ref_name == 'feature/movioxp-v3.1-qa2' && '3.1.0-qa2.1' || github.ref_name == 'feature/movioxp-v3.1-profile-updater' && '3.1.0-qa1' || github.ref_name == 'release/movioxp-3.0.0' && '3.0.0' || github.ref_name == 'feature/movioxp-qa6' && '1.0.86-qa6' || '1.0.85-qa5' }}-Discover-Home-SIGNED
          path: dist/*
          if-no-files-found: error
          retention-days: 21


      - name: Publish signed MovioXP QA prerelease
        if: github.ref_name == 'qa/movioxp-android-refresh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=movioxp-3.1.0-qa6
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::QA release $TAG already exists. Use a new QA version for a replacement build."
            exit 1
          fi
          gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 3.1.0-qa6" --notes-file docs/movioxp-qa6.md


      - name: Publish MovioXP 4.0 A experimental prerelease
        if: github.ref_name == 'movioxp-v4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0-a dist/MovioXP-4.0-A.apk --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 4.0 A — Experimental Edition" --notes-file docs/movioxp-v4-a.md


      - name: Publish MovioXP 4.0 B Cinema prerelease
        if: github.ref_name == 'movioxp-v4-cinema'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0-b dist/MovioXP-4.0-B.apk dist/movioxp-version.json --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 4.0 B — Cinema Interface" --notes-file docs/movioxp-v4-b.md


      - name: Publish MovioXP 4.0 C Cinema Polish prerelease
        if: github.ref_name == 'movioxp-v4-cinema-polish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0-c dist/MovioXP-4.0-C.apk dist/movioxp-version.json dist/MovioXP-4.0-C-release.zip \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 4.0 C — Cinema Polish" --notes-file docs/movioxp-v4-c.md


      - name: Publish MovioXP 4.0 D TV Simulation prerelease
        if: github.ref_name == 'movioxp-v4-tv-simulation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0-d dist/MovioXP-4.0-D.apk dist/movioxp-version.json --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 4.0 D — TV Simulation" --notes-file docs/movioxp-v4-d.md

      - name: Publish MovioXP 4.0 E QA prerelease
        if: github.ref_name == 'movioxp-v4-simulation-corrections'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0-e dist/MovioXP-4.0-E.apk dist/movioxp-version.json --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 4.0 E — Cinema and Simulator Corrections" --notes-file docs/movioxp-v4-e.md


      - name: Publish MovioXP 4.0 F QA prerelease
        if: github.ref_name == 'movioxp-v4-cinema-navigation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0-f dist/MovioXP-4.0-F.apk dist/movioxp-version.json --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 4.0 F — Cinema Experience and Navigation Refinement" --notes-file docs/movioxp-v4-f.md


      - name: Publish MovioXP 4.0 G QA prerelease
        if: github.ref_name == 'movioxp-v4-home-grid'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0-g dist/MovioXP-4.0-G.apk dist/movioxp-version.json --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 4.0 G — Cinematic Home and Category Browsing" --notes-file docs/movioxp-v4-g.md


      - name: Publish MovioXP 4.0 H QA prerelease
        if: github.ref_name == 'movioxp-v4-feature-cache'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0-h dist/MovioXP-4.0-H.apk dist/movioxp-version.json --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 4.0 H — Cache-first Cinema Home" --notes-file docs/movioxp-v4-h.md


      - name: Publish MovioXP 4.0 I QA prerelease
        if: github.ref_name == 'movioxp-v4-cinema-i'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0-i dist/MovioXP-4.0-I.apk dist/movioxp-version.json --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 4.0 I — Cinema Navigation" --notes-file docs/movioxp-v4-i.md

      - name: Publish MovioXP 4.0 J QA prerelease
        if: github.ref_name == 'movioxp-v4-cinema-j'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0-j dist/MovioXP-4.0-J.apk dist/movioxp-version.json --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MovioXP 4.0 J — Final Cinema Refinement" --notes-file docs/movioxp-v4-j.md
