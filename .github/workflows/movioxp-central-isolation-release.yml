name: MovioXP Profile chooser and library grid - signed release QA

on:
  push:
    branches:
      - fix/movioxp-central-profile-isolation-release
      - feature/movioxp-profile-library-v80
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out fixed MovioXP branch
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode dedicated MovioXP release keystore
        env:
          MOVIOXP_KEYSTORE_BASE64: ${{ secrets.MOVIOXP_KEYSTORE_BASE64 }}
          MOVIOXP_KEYSTORE_PASSWORD: ${{ secrets.MOVIOXP_KEYSTORE_PASSWORD }}
          MOVIOXP_KEY_ALIAS: ${{ secrets.MOVIOXP_KEY_ALIAS }}
          MOVIOXP_KEY_PASSWORD: ${{ secrets.MOVIOXP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MOVIOXP_KEYSTORE_BASE64 MOVIOXP_KEYSTORE_PASSWORD MOVIOXP_KEY_ALIAS MOVIOXP_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required MovioXP signing secret $name is missing; refusing to produce an unsigned APK."
              exit 1
            fi
          done
          printf '%s' "$MOVIOXP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/movioxp-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/movioxp-release.jks" >> "$GITHUB_ENV"
          echo "Release keystore prepared."

      - name: Unit tests and signed release APK
        env:
          VERSION_CODE: '100080'
          VERSION_NAME: '1.0.80-qa1'
          KEYSTORE_PASSWORD: ${{ secrets.MOVIOXP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOVIOXP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOVIOXP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testStandardDebugUnitTest :app:assembleStandardRelease --stacktrace
          test -n "$(find app/build/outputs/apk/standard/release -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Verify release APK signing
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/standard/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          [ -n "$SDK_APKSIGNER" ] || { echo "::error::apksigner missing"; exit 1; }
          "$SDK_APKSIGNER" verify "$APK"
          mkdir -p dist
          cp "$APK" dist/MovioXP-1.0.80-qa1-profile-library-release.apk

      - name: Upload signed QA release APK
        uses: actions/upload-artifact@v7
        with:
          name: MovioXP-1.0.80-qa1-Profile-Library-SIGNED
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 21
