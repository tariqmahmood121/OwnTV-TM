      - name: Replay mandatory V9.3 QA i18n and AAPT2 resource checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GATES'
          import subprocess, yaml
          from pathlib import Path
          p=Path('.github/workflows/moviotv-v93-qa7b-new-filename.yml')
          doc=yaml.safe_load(p.read_text(encoding='utf8'))
          steps=doc['jobs']['v93-responsive-qa']['steps']
          for prefix in ('04A - ', '04B - '):
              found=[x for x in steps if x.get('name','').startswith(prefix) and 'run' in x]
              if len(found)!=1: raise RuntimeError('Missing verified gate '+prefix)
              print('RUN VERIFIED GATE:',found[0]['name'],flush=True)
              subprocess.run(['bash','-e','-o','pipefail','-c',found[0]['run']], check=True)
          PY_GATES
      - name: Mandatory Kotlin compiler BEFORE APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -Powntv.corePath="$GITHUB_WORKSPACE/moviotv-core" :app:compileStandardDebugKotlin --no-daemon --stacktrace
      - name: Lint, unit tests, build actual Debug QA APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -Powntv.corePath="$GITHUB_WORKSPACE/moviotv-core" lintStandardDebug testStandardDebugUnitTest assembleStandardDebug --no-daemon --stacktrace
      - name: Verify APK metadata, signature, and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=app/build/outputs/apk/standard/debug/app-standard-debug.apk
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt" && test -x "$signer"
          "$signer" verify --verbose "$apk"
          "$aapt" dump badging "$apk" | head -n 5
          cp "$apk" dist/MovioTV-V94-QA2-LINT-FIXED-NOT-FINAL-debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload INTEGRATION QA only (NOT complete feature release)
        uses: actions/upload-artifact@v4
        with:
          name: MovioTV-V94-QA2-LINT-FIXED-NOT-FINAL
          path: |
            dist/MovioTV-V94-QA2-LINT-FIXED-NOT-FINAL-debug.apk
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - name: Preserve Android lint, tests and Kotlin failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MovioTV-V94-QA2-FAILURE-LOGS
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
            build/reports/problems/**
          if-no-files-found: warn
