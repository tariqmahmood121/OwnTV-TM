# MovioTV V7.7 — isolated test build. Upload ONLY this file to the path below
# .github/workflows/moviotv-v77-build.yml on feature/moviotv-v76.
# Does NOT modify main, V7.5 or V7.6. Do not merge it until tested on phone and TV.
name: MovioTV V7.7 - Details Ratings Year Sort Diagnostics
'on':
  push:
    branches:
      - feature/moviotv-v76
    paths:
      - .github/workflows/moviotv-v77-build.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moviotv-v77-test-build
  cancel-in-progress: false
jobs:
  build-v77:
    if: github.ref == 'refs/heads/feature/moviotv-v76'
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      VERSION_CODE: '100014'
      VERSION_NAME: '7.7'
    steps:
      - name: Check out V7.6 source (protected reference)
        uses: actions/checkout@v4
        with:
          ref: feature/moviotv-v76
          fetch-depth: 0
          persist-credentials: true
      - name: Work on separate V7.7 test branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c feature/moviotv-v77
      - name: Apply tightly checked V7.7 changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('app/src/main/java/tv/own/owntv')

          def patch(path, before, after, n=1):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              hits=s.count(before)
              if hits!=n: raise SystemExit(f'V7.7 safe-patch FAILED {path}: expected {n} anchors, got {hits}: {before[:100]!r}')
              p.write_text(s.replace(before,after,n),encoding='utf-8')
              print('PATCH',path,'(',n,')')

          def add_resource(path, values):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              for key, value in values.items():
                  if re.search(r'<string name="'+re.escape(key)+r'"',s):
                      raise SystemExit('V7.7 attempted duplicate resource: '+key)
                  # XML text already escaped by caller
                  s=s.replace('</resources>',f'    <string name="{key}">{value}</string>\n</resources>')
              p.write_text(s,encoding='utf-8')

          # V7.7 always installs side by side and never overwrites protected V7.5/V7.6.
          patch('app/build.gradle.kts','applicationIdSuffix = ".moviotv76"','applicationIdSuffix = ".moviotv77"')
          patch('app/src/main/res/values/strings_moviotv.xml','<string name="moviotv_version">v7.6</string>','<string name="moviotv_version">v7.7</string>')

          # The companion browser's big header is R.string.app_name inside the published Core dependency.
          # Overriding the app_name resource, not changing protocol names or backup extensions, fixes all
          # browser modes (PIN, add/edit source, remote backup, images, sync), without forking Core.
          core_brands=Path('app/src/main/res/values/strings_moviotv_core_brand.xml')
          brands=core_brands.read_text(encoding='utf-8')
          if '<string name="app_name">' not in brands:
              brands=brands.replace('</resources>','<string name="app_name">MovioTV</string>\n</resources>')
          brands=brands.replace('Choose an MovioTV backup file','Choose a MovioTV backup file')
          brands=brands.replace('prepared an MovioTV backup file','prepared a MovioTV backup file')
          brands=brands.replace('owntv-backup.own','moviotv-backup.own')
          core_brands.write_text(brands,encoding='utf-8')

          add_resource('app/src/main/res/values/strings_moviotv.xml',{
              'moviotv_rating_size_title':'Movie rating size',
              'moviotv_rating_size_desc':'Size of yellow star ratings on posters',
              'moviotv_rating_small':'Small',
              'moviotv_rating_medium':'Medium',
              'moviotv_rating_large':'Large',
              'moviotv_show_movie_year':'Show release year',
              'moviotv_show_movie_year_desc':'Display the year on posters (on by default)',
              'moviotv_details_first':'Open details before playing',
              'moviotv_details_first_desc':'Show synopsis and credits before Play (off by default)',
              'moviotv_year_newest':'Release year: newest first',
              'moviotv_year_oldest':'Release year: oldest first',
              'moviotv_play_movie':'Play movie',
