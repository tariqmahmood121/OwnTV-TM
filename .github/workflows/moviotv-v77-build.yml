          patch(vm,'    val sortMode: StateFlow<SettingsRepository.SortMode> = settings.sortMovies','    private val _v77YearSort = MutableStateFlow(0)\n    val v77YearSort: StateFlow<Int> = _v77YearSort.asStateFlow()\n    fun setYearSortOrder(order: Int) { _v77YearSort.value = order.coerceIn(-1, 1) }\n\n    val sortMode: StateFlow<SettingsRepository.SortMode> = settings.sortMovies')
          patch(vm,'    fun setSort(mode: SettingsRepository.SortMode) {\n        viewModelScope.launch { settings.setSortMovies(mode) }','    fun setSort(mode: SettingsRepository.SortMode) {\n        _v77YearSort.value = 0\n        viewModelScope.launch { settings.setSortMovies(mode) }')
          patch(vm,') { key, c, query, sort, _ -> Args(key, c, query, sort) }\n        .combine(custResolved',') { key, c, query, sort, _ -> Args(key, c, query, sort) }\n        .combine(_v77YearSort) { args, order -> args.copy(yearSortOrder = order) }\n        .combine(custResolved')
          patch(vm,'                pagingSource(args.key, args.ctx, args.query, args.sort)\n','                pagingSource(args.key, args.ctx, args.query, args.sort, args.yearSortOrder)\n')
          patch(vm,'    private data class Args(val key: LiveKey, val ctx: Ctx, val query: String, val sort: SettingsRepository.SortMode)','    private data class Args(val key: LiveKey, val ctx: Ctx, val query: String, val sort: SettingsRepository.SortMode, val yearSortOrder: Int = 0)')
          patch(vm,
              '    private fun pagingSource(key: LiveKey, c: Ctx, query: String, sort: SettingsRepository.SortMode): PagingSource<Int, MovieEntity> {\n',
              '''    private fun pagingSource(key: LiveKey, c: Ctx, query: String, sort: SettingsRepository.SortMode, yearOrder: Int = 0): PagingSource<Int, MovieEntity> {
