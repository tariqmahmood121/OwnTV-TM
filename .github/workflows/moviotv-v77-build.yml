      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify strings, unit tests, lint and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/i18n/check_hardcoded_strings.py verify --bootstrap
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest lintStandardDebug assembleStandardDebug --stacktrace
      - name: Verify generated APK is isolated V7.7
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/standard/debug/*.apk)
          test "${#apks[@]}" -eq 1
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          "$aapt" dump badging "${apks[0]}" > /tmp/moviotv-v77-badging.txt
          grep -F "package: name='tv.own.owntv.moviotv77'" /tmp/moviotv-v77-badging.txt
          grep -F "application-label:'MovioTV'" /tmp/moviotv-v77-badging.txt
          grep -F "versionName='7.7'" /tmp/moviotv-v77-badging.txt
          grep -F "versionCode='100014'" /tmp/moviotv-v77-badging.txt
      - name: Upload V7.7 test APK for phone and TV
        uses: actions/upload-artifact@v4
        with:
          name: MovioTV-V7.7-TEST-APK
          path: app/build/outputs/apk/standard/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Save compiled source ONLY on V7.7 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/res/values/strings_moviotv.xml app/src/main/res/values/strings_moviotv_core_brand.xml app/src/main/java/tv/own/owntv/features/
          git diff --cached --quiet && exit 0
          git commit -m 'MovioTV V7.7: profile movie choices, real year sort, optional details, live diagnostics, browser branding'
          git push origin HEAD:refs/heads/feature/moviotv-v77
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MovioTV-V7.7-Compile-Diagnostics
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn
          retention-days: 14
