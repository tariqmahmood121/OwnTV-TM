              'moviotv_diagnostics_step_internet_ok':'2. Internet access: verified',
              'moviotv_diagnostics_step_internet_off':'2. Internet access: unavailable or limited',
              'moviotv_diagnostics_step_provider_running':'4. Provider connection: checking…',
              'moviotv_diagnostics_step_provider_ok':'4. Provider connection: reachable',
              'moviotv_diagnostics_step_provider_fail':'4. Provider connection: cannot reach server (DNS, routing or server issue)',
              'moviotv_diagnostics_step_provider_pending':'4. Provider connection: waiting for internet',
              'moviotv_diagnostics_step_account_ok':'5. Account: accepted by provider',
              'moviotv_diagnostics_step_account_fail':'5. Account: rejected or expired',
