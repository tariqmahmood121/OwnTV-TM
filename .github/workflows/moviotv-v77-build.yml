          # Auto-connection testing surfaces the existing tester's full report instead of a short toast.
          # It uses the *active playback source*, not the first configured source.
          shell=ROOT/'features/shell/OwnTVShell.kt'
          patch(shell,'    val v76Buffering by dockedEngine.buffering.collectAsStateWithLifecycle()','''    val v76Buffering by dockedEngine.buffering.collectAsStateWithLifecycle()
              val v77AutoTest by v76DiagnosticsVm.sourceTest.collectAsStateWithLifecycle()
              var v77AutoDiagnosticVisible by remember { mutableStateOf(false) }''')
          patch(shell,'LaunchedEffect(watchingSourceId, dockedEngine, v76PlaybackError, v76Buffering, playerMode) {','LaunchedEffect(watchingSourceId, dockedEngine, v76PlaybackError, v76Buffering, playerMode, isOffline) {')
          patch(shell,'if (v76PlaybackError == null && !v76Buffering) return@LaunchedEffect','if (!isOffline && v76PlaybackError == null && !v76Buffering) return@LaunchedEffect')
          patch(shell,'kotlinx.coroutines.delay(12_000L)','kotlinx.coroutines.delay(10_000L)',1)
          patch(shell,'if (dockedEngine.error.value == null && !dockedEngine.buffering.value) return@LaunchedEffect','if (!isOffline && dockedEngine.error.value == null && !dockedEngine.buffering.value) return@LaunchedEffect')
          patch(shell,'        localSubToast.show(v76CheckingLabel)','        v77AutoDiagnosticVisible = true')
          patch(shell,'    // Leaving the app while video plays can keep it going in a picture-in-picture window, which shows','''    // If connectivity returns while the panel is visible, automatically re-check the source.
              LaunchedEffect(isOffline, v77AutoDiagnosticVisible) {
                  if (!isOffline && v77AutoDiagnosticVisible && playerMode != PlayerMode.NONE) {
                      kotlinx.coroutines.delay(2_000L)
                      v76LatestSources.firstOrNull { it.id == watchingSourceId }?.let(v76DiagnosticsVm::testSource)
                  }
              }
              // Leaving the app while video plays can keep it going in a picture-in-picture window, which shows''')
          patch(shell,'    val incompleteRestore by restoreSettings.restoreInProgress.collectAsStateWithLifecycle(initialValue = null)','''    // Persistent result panel. It can be dismissed explicitly; no vanishing toast.
              if (v77AutoDiagnosticVisible && v77AutoTest != null && playerMode != PlayerMode.NONE) {
                  tv.own.owntv.features.settings.SourceTestDialog(
                      state = v77AutoTest!!,
