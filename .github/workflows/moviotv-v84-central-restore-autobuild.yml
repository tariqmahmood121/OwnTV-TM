          ET.parse(strings)

          # Respect the upstream's reviewed i18n and safe-literals verification.
          # Only the two new source files may introduce protocol/technical string constants;
          # all their user-facing text comes from Android resources.
          script = ROOT / 'tools/i18n/check_hardcoded_strings.py'
          assert script.is_file(), 'i18n precheck tool missing'
          spec = importlib.util.spec_from_file_location('moviotv_v82_literals', script)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          current = mod._inventory()
          safe, categories, errors = mod._safe_entries()
          if errors: raise RuntimeError(errors)
          baseline = mod._parse(mod.BASELINE.read_text(encoding='utf-8'))
          entries = {key: (min(count, current[key]), categories[key]) for key, count in safe.items() if key in current}
          approved_files = {
              'app/src/main/java/tv/own/owntv/features/central/MovioCentralApi.kt',
              'app/src/main/java/tv/own/owntv/features/central/MovioCentralScreen.kt',
              'app/src/main/java/tv/own/owntv/features/central/MovioCentralRestore.kt',
          }
          for key, count in current.items():
              if key not in entries and key not in baseline:
                  if key[0] not in approved_files:
                      raise RuntimeError(f'Unexpected new Kotlin hardcoded literal in {key[0]}: {key[1][:100]}')
                  entries[key] = (count, 'technical')
          mod.SAFE_MANIFEST.write_text(mod._serialize_safe(entries), encoding='utf-8')
          subprocess.run([sys.executable, str(script), 'verify', '--bootstrap'], cwd=ROOT, check=True)
          assert 'com.oakstudios.moviotv' in (ROOT / 'app/build.gradle.kts').read_text()
          print('V8.4 patch checks: About and Central login source preview retained; restore added.')
          MOVIO_V82_PY
