name: MovioTV V8.4 - Central Restore and Source Provisioning (Auto Build)
run-name: MovioTV V8.4 Central - ${{ github.ref_name }} - ${{ github.run_number }}
# Upload to .github/workflows on feature/moviotv-v8-stability.
# Reuses the proven V8.2 recipe and the pinned V8.1 code; no stable branch changes.
'on':
  push:
    paths:
      - '.github/workflows/moviotv-v84-central-restore*.yml'
      - '.github/workflows/moviotv-v84-central-restore*.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moviotv-v84-central-qa
  cancel-in-progress: false
jobs:
  build-v84:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      VERSION_NAME: '8.4.0'
      VERSION_CODE: '100104'
    steps:
      - name: Checkout V8.1 stable source (never modify stable branch)
        uses: actions/checkout@v4
        with:
          ref: feature/moviotv-v81-stability
          fetch-depth: 0
      - name: Checkout pinned upstream Core 1.0.71
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV_Core
          ref: 0b60ef6d25e03a24193f1a5680cb239816fd8625
          path: moviotv-core
          persist-credentials: false
      - name: Apply retained Core branding patch and V8.4 Central provisioning and merge
        shell: bash
        run: |
          set -euo pipefail
          test -s patches/v81-core-changes.patch
          git -C moviotv-core apply --check "$GITHUB_WORKSPACE/patches/v81-core-changes.patch"
          git -C moviotv-core apply "$GITHUB_WORKSPACE/patches/v81-core-changes.patch"
          cat > /tmp/moviotv-v84-bridge.py <<'MOVIO_V82_PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import re
          import sys
          import importlib.util
          import subprocess
          import xml.etree.ElementTree as ET

          ROOT = Path.cwd()
          more_file = ROOT / 'app/src/main/java/tv/own/owntv/features/more/MoreScreen.kt'
          assert more_file.is_file(), 'MovioTV branch does not contain the More page'
          s = more_file.read_text(encoding='utf-8')

          def replace_exact(old, new, expected=1):
              global s
              assert s.count(old) == expected, f'MoreScreen source mismatch, expected {expected} matches for {old[:100]!r}, got {s.count(old)}'
              s = s.replace(old, new)

          replace_exact('SETTINGS, FAVORITES, HISTORY, BACKUP, LOCAL_SYNC, ERROR_LOG, ABOUT, DEVELOPER',
                        'SETTINGS, FAVORITES, HISTORY, BACKUP, LOCAL_SYNC, CENTRAL, ERROR_LOG, ABOUT, DEVELOPER')
          replace_exact('setOf(MoreItem.BACKUP, MoreItem.LOCAL_SYNC, MoreItem.DEVELOPER)',
                        'setOf(MoreItem.BACKUP, MoreItem.LOCAL_SYNC, MoreItem.CENTRAL, MoreItem.DEVELOPER)')
          replace_exact('item(MoreItem.LOCAL_SYNC, OwnTVIcon.PHONE, stringResource(R.string.local_sync_title), stringResource(if (sync.listening) R.string.common_on else R.string.common_off), false)',
                        'item(MoreItem.LOCAL_SYNC, OwnTVIcon.PHONE, stringResource(R.string.local_sync_title), stringResource(if (sync.listening) R.string.common_on else R.string.common_off), false)\n'
                        '            item(MoreItem.CENTRAL, OwnTVIcon.PHONE, stringResource(R.string.moviotv_central_title), null, false)'.replace('\\n', '\n'))
          replace_exact('MoreItem.LOCAL_SYNC -> LocalSyncScreen(entry = pageTarget, modifier = Modifier.fillMaxSize())',
                        'MoreItem.LOCAL_SYNC -> LocalSyncScreen(entry = pageTarget, modifier = Modifier.fillMaxSize())\n'
                        '                MoreItem.CENTRAL -> tv.own.owntv.features.central.MovioCentralScreen(onBack = backToSheet, modifier = Modifier.fillMaxSize().focusRequester(pageTarget).focusGroup())'.replace('\\n','\n'))
          # The real TV More > About page was still using upstream OwnTV content. The existing
          # Oak Studios Movio About screen was already wired only to Settings > About.
          replace_exact('MoreItem.ABOUT -> AboutPage(vm = vm, entry = pageTarget, onOpenLanguage = { onOpenSettings(8, false) })',
                        'MoreItem.ABOUT -> tv.own.owntv.features.settings.MovioAboutScreen(onBack = aboutBack, modifier = Modifier.fillMaxSize().focusRequester(pageTarget).focusGroup())')
          # About's Back must change the selected page, not only move focus on the left sheet.
          replace_exact('    val backToSheet: () -> Unit = { runCatching { itemFocus.getValue(selected).requestFocus() } }',
                        '    val backToSheet: () -> Unit = { runCatching { itemFocus.getValue(selected).requestFocus() } }\n    val aboutBack: () -> Unit = {\n        chosen = MoreItem.SETTINGS\n        pageEntry = null\n        runCatching { itemFocus.getValue(MoreItem.SETTINGS).requestFocus() }\n    }')
          more_file.write_text(s, encoding='utf-8')
          # Keep the About button visible above the mobile bottom navigation bar.
          about_file = ROOT / 'app/src/main/java/tv/own/owntv/features/settings/MovioAboutScreen.kt'
          about = about_file.read_text(encoding='utf-8')
          def tweak_about(old, new):
              global about
              if about.count(old) != 1:
                  raise RuntimeError(f'V8.4 About layout did not match: {old[:80]}')
              about = about.replace(old, new)
          tweak_about('.verticalScroll(rememberScrollState()).padding(32.dp),',
                      '.verticalScroll(rememberScrollState()).padding(start = 32.dp, end = 32.dp, top = 20.dp, bottom = 112.dp),')
          tweak_about('        Text(stringResource(R.string.moviotv_about_licence), style = stageText(15, 400), color = StageColors.Muted)\n        StageButton(stringResource(R.string.common_back), onClick = onBack)',
                      '        StageButton(stringResource(R.string.common_back), onClick = onBack)\n        Text(stringResource(R.string.moviotv_about_licence), style = stageText(15, 400), color = StageColors.Muted)')
          about_file.write_text(about, encoding='utf-8')

          src_dir = ROOT / 'app/src/main/java/tv/own/owntv/features/central'
          src_dir.mkdir(parents=True, exist_ok=True)
          (src_dir / 'MovioCentralApi.kt').write_text(r'''package tv.own.owntv.features.central

          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          /** Small, opt-in, OFFLINE-SAFE bridge to the user's existing MovioTV Central PHP API.
           * No catalogue or local favourites are written or cleared by this initial connection test.
           * Credentials are sent by HTTPS; only the session token is kept, encrypted in Android Keystore.
           */
          internal class MovioCentralApi(private val context: Context) {
              private val preferences = context.getSharedPreferences("moviotv_central_auth_v1", Context.MODE_PRIVATE)

              private fun secretKey(): SecretKey {
                  val store = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  val existing = store.getKey(KEY_ALIAS, null) as? SecretKey
                  if (existing != null) return existing
                  val generator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  generator.init(
                      KeyGenParameterSpec.Builder(KEY_ALIAS, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setRandomizedEncryptionRequired(true)
                          .build()
                  )
                  return generator.generateKey()
              }

              private fun storeToken(token: String) {
                  val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                  cipher.init(Cipher.ENCRYPT_MODE, secretKey())
                  val bytes = cipher.iv + cipher.doFinal(token.toByteArray(Charsets.UTF_8))
                  preferences.edit().putString("session", Base64.encodeToString(bytes, Base64.NO_WRAP)).apply()
              }

              private fun token(): String? = runCatching {
                  val saved = preferences.getString("session", null) ?: return@runCatching null
                  val bytes = Base64.decode(saved, Base64.DEFAULT)
                  if (bytes.size < 13) return@runCatching null
                  val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                  cipher.init(Cipher.DECRYPT_MODE, secretKey(), GCMParameterSpec(128, bytes.copyOfRange(0, 12)))
                  String(cipher.doFinal(bytes.copyOfRange(12, bytes.size)), Charsets.UTF_8)
              }.getOrNull()

              fun hasSession(): Boolean = !token().isNullOrBlank()
              fun disconnect() = preferences.edit().remove("session").apply()

              private fun call(route: String, method: String = "GET", body: JSONObject? = null, requiresAuth: Boolean = false): JSONObject {
                  val url = URL(BASE + route)
                  require(url.protocol == "https")
                  val connection = (url.openConnection() as HttpURLConnection).apply {
                      requestMethod = method
                      connectTimeout = 8000
                      readTimeout = 12000
                      setRequestProperty("Accept", "application/json")
                      if (requiresAuth) {
                          val auth = token() ?: throw IOException("Not connected to MovioTV Central")
                          setRequestProperty("Authorization", "Bearer $auth")
                      }
                      if (body != null) {
                          doOutput = true
                          setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      }
                  }
                  try {
                      if (body != null) connection.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = connection.responseCode
                      if (code !in 200..299) throw IOException("Central returned HTTP $code")
                      val data = connection.inputStream.bufferedReader().use { it.readText() }
                      return JSONObject(data)
                  } finally {
                      connection.disconnect()
                  }
              }

              suspend fun health(): JSONObject = withContext(Dispatchers.IO) { call("health") }
              suspend fun signIn(username: String, password: String): JSONObject = withContext(Dispatchers.IO) {
                  require(username.isNotBlank() && password.isNotBlank())
                  val response = call("login", "POST", JSONObject().put("username", username.trim()).put("password", password))
                  val session = response.optString("token")
                  if (session.isBlank()) throw IOException("Central did not return a session token")
                  storeToken(session)
                  response
              }
              suspend fun me(): JSONObject = withContext(Dispatchers.IO) { call("me", requiresAuth = true) }
              suspend fun profiles(): JSONObject = withContext(Dispatchers.IO) { call("profiles", requiresAuth = true) }
              suspend fun provisioning(): JSONObject = withContext(Dispatchers.IO) { call("provisioning", requiresAuth = true) }
              suspend fun assignments(): JSONObject = withContext(Dispatchers.IO) { call("assignments", requiresAuth = true) }
              suspend fun profileRecords(profileId: Long): JSONObject = withContext(Dispatchers.IO) {
                  require(profileId > 0)
                  call("sync?profile_id=$profileId", requiresAuth = true)
              }
              // Provider assignments are queried on demand only. No source credentials are stored.
              // Authorised bootstrap MUST be scoped to this account and profile on the PHP side.
              // Includes assigned provider URLs/credentials plus canonical cloud sync records.
              // Called on explicit restore only; never during startup or playback.
              suspend fun profileBootstrap(profileId: Long): JSONObject = withContext(Dispatchers.IO) {
                  require(profileId > 0)
                  call("profiles/$profileId/bootstrap", requiresAuth = true)
              }
              suspend fun profileSources(profileId: Long): JSONObject = withContext(Dispatchers.IO) {
                  require(profileId > 0)
                  call("profiles/$profileId/sources", requiresAuth = true)
              }

              companion object {
                  private const val KEY_ALIAS = "moviotv-central-session-aes-v1"
                  private const val BASE = "https://moviotv.opticalzoo.com/movio/api/index.php/"
              }
          }
          ''', encoding='utf-8')

          (src_dir / 'MovioCentralRestore.kt').write_text(r'''package tv.own.owntv.features.central

          import java.io.IOException
          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import tv.own.owntv.core.backup.UserDataResolver
          import tv.own.owntv.core.database.dao.SourceDao
          import tv.own.owntv.core.database.entity.ProfileSourceCrossRef
          import tv.own.owntv.core.database.entity.SourceEntity
          import tv.own.owntv.core.model.SourceType
          import tv.own.owntv.core.repository.SourceRepository
          import tv.own.owntv.core.settings.SettingsRepository
          import tv.own.owntv.core.sync.SyncResult
          import kotlinx.coroutines.flow.first

          internal data class CentralRestoreSummary(
              val added: Int,
              val reused: Int,
              val resolved: Int,
              val pending: Int,
              val skipped: Int,
              val failedCatalogs: Int,
          )

          /**
           * Explicit cloud-to-local import. Never deletes a local source, local favourite or history entry.
           * Uses OwnTV Core's stable-id resolver (including its durable pending queue) rather than using
           * transient movie ids or replacing the user's local database. No automatic server writes.
           */
          internal class MovioCentralRestore(
              private val context: Context,
              private val sourceRepository: SourceRepository,
              private val sourceDao: SourceDao,
              private val userData: UserDataResolver,
              private val settings: SettingsRepository,
          ) {
              private data class Provider(
                  val key: String,
                  val name: String,
                  val type: SourceType,
                  val url: String,
                  val user: String,
                  val pass: String,
                  val preferred: Boolean,
              )

              private fun first(o: JSONObject, vararg fields: String): String {
                  for (field in fields) {
                      val s = o.optString(field).trim()
                      if (s.isNotEmpty() && s != "null") return s
                  }
                  return ""
              }

              private fun providers(root: JSONObject): List<Provider> {
                  val data = root.optJSONArray("sources") ?: throw IOException("Central bootstrap has no sources list")
                  require(data.length() <= 100) { "Too many assigned providers in Central response" }
                  return (0 until data.length()).mapNotNull { n ->
                      val item = data.optJSONObject(n) ?: return@mapNotNull null
                      val typeText = first(item, "source_type", "type").lowercase()
                      val type = when (typeText) {
                          "xtream", "xtream_codes", "xtream-codes" -> SourceType.XTREAM
                          "m3u", "playlist" -> SourceType.M3U
                          else -> throw IOException("Unsupported Central provider type")
                      }
                      val url = first(item, "url", "server_url", "xtream_url", "playlist_url")
                      val user = first(item, "username", "provider_username")
                      val pass = first(item, "password", "provider_password")
                      if (!url.startsWith("https://") && !url.startsWith("http://")) {
                          throw IOException("Central did not provide a valid provider URL")
                      }
                      if (type == SourceType.XTREAM && (user.isEmpty() || pass.isEmpty())) {
                          throw IOException("Central must return assigned Xtream credentials securely")
                      }
                      Provider(
                          key = first(item, "provider_id", "id"),
                          name = first(item, "label", "display_name", "name").ifBlank { "Central provider" },
                          type = type, url = url, user = user, pass = pass,
                          preferred = item.optBoolean("is_default", false),
                      )
                  }
              }

              private fun same(a: String, b: String) = a.trim().trimEnd('/') == b.trim().trimEnd('/')

              suspend fun restore(localProfileId: Long, remoteProfileId: Long, remote: JSONObject): CentralRestoreSummary {
                  require(remoteProfileId > 0L) { "Invalid cloud profile" }
                  val links = context.getSharedPreferences("moviotv_central_profile_links_v1", Context.MODE_PRIVATE)
                  val linkKey = "local_$localProfileId"
                  val bound = links.getLong(linkKey, -1L)
                  if (bound > 0L && bound != remoteProfileId) {
                      throw IOException("This local profile is linked to another Central profile. Choose a different local profile")
                  }
                  require(localProfileId > 0L) { "Choose an active local profile first" }
                  val providers = providers(remote)
                  require(providers.isNotEmpty()) { "No assigned providers. Nothing has been changed." }
                  val records = remote.optJSONArray("records") ?: JSONArray()
                  require(records.length() <= 10000) { "Central records require pagination; nothing has been imported" }
                  val existing = sourceDao.getAllOnce()
                  // Fail BEFORE any writes if an existing provider is configured with different credentials.
                  // The user should decide whether to replace those, never silently duplicate or overwrite.
                  for (provider in providers) {
                      val match = existing.firstOrNull {
                          it.type == provider.type && same(it.url, provider.url) &&
                              (provider.type == SourceType.M3U || it.username == provider.user)
                      }
                      if (match != null && provider.type == SourceType.XTREAM && match.password != provider.pass) {
                          throw IOException("Existing provider credentials differ; update that source manually")
                      }
                  }

                  // Remember the cloud mapping BEFORE any local writes; failed catalogue imports must not
                  // permit a different cloud profile to be imported into the same local profile later.
                  links.edit().putLong(linkKey, remoteProfileId).apply()
                  var added = 0
                  var reused = 0
                  var failedCatalogs = 0
                  val ids = LinkedHashMap<String, Long>()
                  val toSync = mutableListOf<SourceEntity>()
                  for (provider in providers) {
                      val match = sourceDao.getAllOnce().firstOrNull {
                          it.type == provider.type && same(it.url, provider.url) &&
                              (provider.type == SourceType.M3U || it.username == provider.user)
                      }
                      val local = if (match != null) {
                          sourceDao.link(ProfileSourceCrossRef(profileId = localProfileId, sourceId = match.id))
                          reused++
                          if (match.lastSyncAt == null) toSync.add(match)
                          match
                      } else {
                          val created = when (provider.type) {
                              SourceType.XTREAM -> sourceRepository.addXtreamSource(
                                  profileId = localProfileId, name = provider.name, serverUrl = provider.url,
                                  username = provider.user, password = provider.pass,
                              )
                              SourceType.M3U -> sourceRepository.addM3uSource(
                                  profileId = localProfileId, name = provider.name, url = provider.url,
                              )
                              else -> throw IOException("Unsupported Central source")
                          }
                          added++
                          toSync.add(created)
                          created
                      }
                      if (provider.key.isNotBlank()) ids[provider.key] = local.id
                      if (provider.preferred && settings.defaultSourceId.first() <= 0L) {
                          settings.setDefaultSource(local.id)
                      }
                  }

                  // Import catalogue before attaching favourites/history. A provider failure is not a data
                  // deletion; unresolved viewing records remain pending and reattach after a later resync.
                  for (source in toSync) {
                      try {
                          if (sourceRepository.sync(source, onProgress = {}) !is SyncResult.Success) {
                              failedCatalogs++
                          }
                      } catch (_: Exception) {
                          failedCatalogs++
                      }
                  }

                  val normalized = JSONArray()
                  for (i in 0 until records.length()) {
                      val record = records.optJSONObject(i) ?: continue
                      val kind = when (first(record, "record_type").lowercase()) {
                          "favourite", "favorite", "fav" -> "fav"
                          "history", "his" -> "his"
                          "resume", "progress", "prog" -> "prog"
                          else -> continue
                      }
                      val payload = record.optJSONObject("payload")
                          ?: runCatching { JSONObject(record.optString("payload")) }.getOrNull() ?: continue
                      val typeString = first(payload, "t", "media_type", "type").uppercase()
                          .ifBlank { first(record, "record_key").substringBefore(':').uppercase() }
                      val mediaType = when (typeString) {
                          "MOVIE", "FILM" -> "MOVIE"
                          "SERIES", "SHOW" -> "SERIES"
                          "LIVE", "CHANNEL" -> "LIVE"
                          "EPISODE" -> "EPISODE"
                          else -> continue
                      }
                      val key = first(record, "record_key")
                      val rid = first(payload, "rid", "remote_id", "stream_id", "content_id")
                          .ifBlank { key.substringAfter(':', "") }
                      if (rid.isBlank()) continue
                      val providerKey = first(payload, "provider_id", "source_id")
                      val sourceId = ids[providerKey] ?: if (providers.size == 1) ids.values.firstOrNull() else null
                      if (sourceId == null) continue  // Never guess which provider owns a title.
                      val atRaw = payload.optLong("at", payload.optLong("updated_at_ms", System.currentTimeMillis()))
                      val at = if (atRaw in 1..9999999999L) atRaw * 1000L else atRaw
                      val item = JSONObject()
                          .put("p", localProfileId).put("src", sourceId).put("t", mediaType)
                          .put("rid", rid).put("kind", kind).put("at", at)
                      if (mediaType == "EPISODE") {
                          val seriesId = first(payload, "srid", "series_remote_id")
                          val season = payload.optInt("season", -1)
                          val episode = payload.optInt("ep", payload.optInt("episode", -1))
                          if (seriesId.isBlank() || season < 0 || episode < 0) continue
                          item.put("srid", seriesId).put("season", season).put("ep", episode)
                      }
                      if (kind == "prog") {
                          val pos = payload.optLong("pos", payload.optLong("position_ms", -1L))
                          if (pos < 0L) continue
                          item.put("pos", pos)
                          item.put("dur", payload.optLong("dur", payload.optLong("duration_ms", 0L)))
                      }
                      normalized.put(item)
                  }
                  val resolved = userData.importAll(normalized)
                  return CentralRestoreSummary(added, reused, resolved, (normalized.length() - resolved).coerceAtLeast(0), records.length() - normalized.length(), failedCatalogs)
              }
          }
          ''', encoding='utf-8')

          (src_dir / 'MovioCentralScreen.kt').write_text(r'''package tv.own.owntv.features.central

          import androidx.activity.compose.BackHandler
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberCoroutineScope
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalResources
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.tv.material3.Text
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import org.koin.compose.koinInject
          import tv.own.owntv.core.repository.SourceRepository
          import tv.own.owntv.core.database.dao.SourceDao
          import tv.own.owntv.core.backup.UserDataResolver
          import tv.own.owntv.core.settings.SettingsRepository
          import org.json.JSONArray
          import tv.own.owntv.R
          import tv.own.owntv.ui.stage.StageButton
          import tv.own.owntv.ui.theme.StageColors
          import tv.own.owntv.ui.theme.stageText

          private data class RemoteProfile(val id: Long, val title: String)

          /** Optional Central import. Existing viewing data is merged, never cleared. */
          @Composable
          fun MovioCentralScreen(onBack: () -> Unit, modifier: Modifier = Modifier) {
              BackHandler(onBack = onBack)
              val context = LocalContext.current
              val resources = LocalResources.current
              val api = remember(context) { MovioCentralApi(context.applicationContext) }
              val sources: SourceRepository = koinInject()
              val sourceDao: SourceDao = koinInject()
              val userData: UserDataResolver = koinInject()
              val localSettings: SettingsRepository = koinInject()
              val localProfileId by localSettings.activeProfileId.collectAsStateWithLifecycle(initialValue = -1L)
              val restorer = remember(sources, sourceDao, userData, localSettings) {
                  MovioCentralRestore(context.applicationContext, sources, sourceDao, userData, localSettings)
              }
              val scope = rememberCoroutineScope()
              var signedIn by remember { mutableStateOf(api.hasSession()) }
              var user by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              var status by remember { mutableStateOf(resources.getString(R.string.moviotv_central_idle)) }
              var remoteProfiles by remember { mutableStateOf<List<RemoteProfile>>(emptyList()) }

              fun launchRequest(operation: suspend () -> String) {
                  if (busy) return
                  busy = true
                  scope.launch {
                      try {
                          status = operation()
                      } catch (e: Exception) {
                          status = resources.getString(R.string.moviotv_central_error, e.message ?: resources.getString(R.string.moviotv_central_unavailable))
                      } finally {
                          busy = false
                      }
                  }
              }

              Column(
                  modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(24.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp),
              ) {
                  Text(stringResource(R.string.moviotv_central_title), style = stageText(32, 800), color = StageColors.Text)
                  Text(stringResource(R.string.moviotv_central_offline_note), style = stageText(15, 400), color = StageColors.Muted)
                  if (!signedIn) {
                      Text(stringResource(R.string.moviotv_central_username), style = stageText(17, 600), color = StageColors.Text)
                      BasicTextField(
                          value = user, onValueChange = { user = it }, singleLine = true,
                          textStyle = TextStyle(fontSize = 19.sp, color = Color.White),
                          modifier = Modifier.fillMaxWidth().background(Color(0xFF352844)).padding(14.dp),
                      )
                      Text(stringResource(R.string.moviotv_central_password), style = stageText(17, 600), color = StageColors.Text)
                      BasicTextField(
                          value = password, onValueChange = { password = it }, singleLine = true,
                          visualTransformation = PasswordVisualTransformation(),
                          textStyle = TextStyle(fontSize = 19.sp, color = Color.White),
                          modifier = Modifier.fillMaxWidth().background(Color(0xFF352844)).padding(14.dp),
                      )
                      StageButton(stringResource(R.string.moviotv_central_connect), onClick = {
                          launchRequest {
                              api.signIn(user, password)
                              password = ""
                              signedIn = true
                              resources.getString(R.string.moviotv_central_connected)
                          }
                      })
                  } else {
                      StageButton(stringResource(R.string.moviotv_central_check), onClick = {
                          launchRequest {
                              api.me()
                              resources.getString(R.string.moviotv_central_connected)
                          }
                      })
                      StageButton(stringResource(R.string.moviotv_central_profiles), onClick = {
                          launchRequest {
                              val result = api.profiles()
                              val array: JSONArray = result.optJSONArray("profiles") ?: result.optJSONArray("data") ?: JSONArray()
                              val list = mutableListOf<RemoteProfile>()
                              for (i in 0 until minOf(array.length(), 100)) {
                                  val p = array.optJSONObject(i) ?: continue
                                  val id = p.optLong("id", -1)
                                  if (id <= 0L) continue
                                  val title = p.optString("name").ifBlank { p.optString("profile_name") }.ifBlank { id.toString() }
                                  list.add(RemoteProfile(id, title))
                              }
                              remoteProfiles = list
                              resources.getString(R.string.moviotv_central_profile_count, list.size)
                          }
                      })
                      Text(stringResource(R.string.moviotv_central_restore_notice), style = stageText(14, 500), color = StageColors.Muted)
                      remoteProfiles.forEach { p ->
                          StageButton(p.title, onClick = {
                              launchRequest {
                                  val data = api.profileRecords(p.id)
                                  val records = data.optJSONArray("records") ?: JSONArray()
                                  resources.getString(R.string.moviotv_central_record_count, p.title, records.length())
                              }
                          })
                          StageButton(stringResource(R.string.moviotv_central_restore_button, p.title), onClick = {
                              launchRequest {
                                  if (localProfileId <= 0L) error("Choose a local profile first")
                                  val bundle = api.profileBootstrap(p.id)
                                  val result = withContext(Dispatchers.IO) {
                                      restorer.restore(localProfileId, p.id, bundle)
                                  }
                                  listOf(
                                      resources.getQuantityString(R.plurals.moviotv_central_sources_added, result.added, result.added),
                                      resources.getQuantityString(R.plurals.moviotv_central_sources_reused, result.reused, result.reused),
                                      resources.getQuantityString(R.plurals.moviotv_central_records_merged, result.resolved, result.resolved),
                                      resources.getQuantityString(R.plurals.moviotv_central_records_pending, result.pending, result.pending),
                                      resources.getQuantityString(R.plurals.moviotv_central_records_skipped, result.skipped, result.skipped),
                                      resources.getQuantityString(R.plurals.moviotv_central_catalog_failures, result.failedCatalogs, result.failedCatalogs),
                                  ).joinToString(" · ")
                              }
                          })
                          StageButton(stringResource(R.string.moviotv_central_sources_button, p.title), onClick = {
                              launchRequest {
                                  val result = api.profileSources(p.id)
                                  val sources = result.optJSONArray("sources")
                                      ?: result.optJSONArray("assignments")
                                      ?: result.optJSONArray("data") ?: JSONArray()
                                  val labels = mutableListOf<String>()
                                  for (i in 0 until minOf(sources.length(), 16)) {
                                      val item = sources.optJSONObject(i) ?: continue
                                      val name = item.optString("display_name").ifBlank { item.optString("name") }
                                          .ifBlank { item.optString("source_name") }
                                          .ifBlank { item.optString("label") }
                                      if (name.isNotBlank()) labels.add(name.take(80))
                                  }
                                  val shown = if (labels.isEmpty()) resources.getString(R.string.moviotv_central_sources_empty)
                                              else labels.joinToString(", ")
                                  resources.getString(R.string.moviotv_central_sources_result, p.title, shown)
                              }
                          })
                      }
                      StageButton(stringResource(R.string.moviotv_central_disconnect), onClick = {
                          api.disconnect()
                          signedIn = false
                          remoteProfiles = emptyList()
                          status = resources.getString(R.string.moviotv_central_disconnected)
                      })
                  }
                  Text(status, style = stageText(16, 500), color = StageColors.Muted)
                  StageButton(stringResource(R.string.common_back), onClick = onBack)
              }
          }
          ''', encoding='utf-8')

          strings = ROOT / 'app/src/main/res/values/strings_moviotv_central.xml'
          strings.write_text('''<?xml version="1.0" encoding="utf-8"?>
