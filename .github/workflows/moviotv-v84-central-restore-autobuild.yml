      - name: Java 25 for Android toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4
      - name: Compile tests lint and installable debug QA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -Powntv.corePath="$GITHUB_WORKSPACE/moviotv-core" \
            lintStandardDebug testStandardDebugUnitTest assembleStandardDebug --stacktrace --no-daemon
      - name: Verify built APK metadata and signing
        shell: bash
        run: |
          set -euo pipefail
          src=app/build/outputs/apk/standard/debug/app-standard-debug.apk
          test -s "$src"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt" && test -x "$signer"
          "$signer" verify "$src"
          "$aapt" dump badging "$src" > /tmp/moviotv-v84-badging.txt
          grep -F "name='com.oakstudios.moviotv'" /tmp/moviotv-v84-badging.txt
          grep -F "versionCode='100104'" /tmp/moviotv-v84-badging.txt
          grep -F "versionName='8.4.0'" /tmp/moviotv-v84-badging.txt
          mkdir -p dist
          cp "$src" dist/MovioTV-v8.4.0-CENTRAL-QA-debug.apk
      - name: Upload installable QA debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MovioTV-V8.4-CENTRAL-QA-DEBUG
          path: dist/MovioTV-v8.4.0-CENTRAL-QA-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Configure permanent release signing, if secrets are present
        id: signing
        shell: bash
        env:
          KEY_B64: ${{ secrets.MOVIOTV_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MOVIOTV_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.MOVIOTV_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MOVIOTV_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEY_B64" && -n "$STORE_PASS" && -n "$ALIAS" && -n "$KEY_PASS" ]]; then
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/moviotv-v82.jks"
            test -s "$RUNNER_TEMP/moviotv-v82.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/moviotv-v82.jks" >> "$GITHUB_ENV"
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'No release-signing secrets. The QA debug APK is available; an existing release-signed app cannot be upgraded using a debug certificate.'
          fi
      - name: Compile production APK with pinned Core and R8
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MOVIOTV_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOVIOTV_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOVIOTV_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew -Powntv.corePath="$GITHUB_WORKSPACE/moviotv-core" assembleStandardRelease --stacktrace --no-daemon
      - name: Verify signed production APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          src="$(find app/build/outputs/apk/standard/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          test -s "$src"
          "$signer" verify --verbose "$src"
          "$aapt" dump badging "$src" > /tmp/v82-release-badging.txt
          grep -F "name='com.oakstudios.moviotv'" /tmp/v82-release-badging.txt
          grep -F "versionCode='100104'" /tmp/v82-release-badging.txt
          grep -F "versionName='8.4.0'" /tmp/v82-release-badging.txt
          cp "$src" dist/MovioTV-v8.4.0-CENTRAL-SIGNED.apk
      - name: Upload release-signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MovioTV-V8.4-CENTRAL-SIGNED-RELEASE
          path: dist/MovioTV-v8.4.0-CENTRAL-SIGNED.apk
          retention-days: 30
          if-no-files-found: error
      - name: Preserve diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MovioTV-V8.4-FAILURE-LOGS
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
            build/reports/problems/**
          retention-days: 30
          if-no-files-found: warn
