        \ hash = MessageDigest.getInstance(\"SHA-256\").digest(identity.toByteArray(Charsets.UTF_8))\n            .joinToString(\"\
        \") { \"%02x\".format(it.toInt() and 255) }.take(40)\n        val prefix = if (kind == \"fav\") \"favorite\" else\
