        \ = stableKey(e, pid, kind)\n            val row = LocalRecord(typeFor(kind), key, localPayload(e, pid, deleted),\
        \ timestamp)\n            val previous = output[\"${row.type}|${row.key}\"]\n            if (previous == null || timestamp\
        \ > previous.timestamp) output[\"${row.type}|${row.key}\"] = row\n        }\n    }\n\n    private data class RemoteRecord(val\
