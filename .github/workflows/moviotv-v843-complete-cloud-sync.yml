        import androidx.work.PeriodicWorkRequestBuilder\nimport androidx.work.WorkManager\nimport androidx.work.WorkerParameters\n\
        import kotlinx.coroutines.sync.Mutex\nimport org.json.JSONArray\nimport org.json.JSONObject\nimport org.koin.core.context.GlobalContext\n\
        import tv.own.owntv.core.backup.UserDataResolver\nimport tv.own.owntv.core.database.dao.ProfileDao\nimport tv.own.owntv.core.database.dao.SourceDao\n\
        import tv.own.owntv.core.database.entity.SourceEntity\nimport java.io.IOException\nimport java.security.MessageDigest\n\
        import java.util.concurrent.TimeUnit\n\n/** Profile-scoped, fail-closed sync of local favourites/history/resume with\
        \ Central's versioned API.\n * Local Room data is the durable retry queue: a failed HTTP call NEVER clears a local\
        \ row.\n * All remote data is merged by the core's existing stable content-id resolver.\n */\ninternal data class\
        \ MovioSyncResult(val profiles: Int, val uploaded: Int, val received: Int, val skipped: Int)\n\ninternal object MovioCentralTwoWaySync\
        \ {\n    private val mutex = Mutex()\n    private const val PERIODIC = \"moviotv-central-sync-15m-v1\"\n    private\
        \ const val ONE_SHOT = \"moviotv-central-sync-now-v1\"\n    fun schedule(context: Context) {\n        val request\
        \ = PeriodicWorkRequestBuilder<MovioCentralSyncWorker>(15, TimeUnit.MINUTES).build()\n        WorkManager.getInstance(context.applicationContext).enqueueUniquePeriodicWork(\n\
        \            PERIODIC, ExistingPeriodicWorkPolicy.KEEP, request)\n    }\n    fun kick(context: Context) {\n      \
        \  WorkManager.getInstance(context.applicationContext).enqueueUniqueWork(\n            ONE_SHOT, ExistingWorkPolicy.KEEP,\
        \ OneTimeWorkRequestBuilder<MovioCentralSyncWorker>().build())\n    }\n\n    private fun str(o: JSONObject, vararg\
        \ keys: String): String {\n        for (key in keys) {\n            val v = o.optString(key).trim()\n            if\
        \ (v.isNotBlank() && v != \"null\") return v\n        }\n        return \"\"\n    }\n    private fun remoteProfileMatch(remote:\
        \ JSONArray, id: Long, localName: String): Boolean =\n        (0 until remote.length()).mapNotNull { remote.optJSONObject(it)\
        \ }.any { row ->\n            row.optLong(\"id\", -1) == id &&\n                str(row, \"name\", \"profile_name\"\
        ).equals(localName.trim(), ignoreCase = true)\n        }\n\n    private fun authorizedSourceMapping(sources: JSONArray,\
        \ locals: List<SourceEntity>): Map<Long, String> {\n        val out = mutableMapOf<Long, String>()\n        for (i\
        \ in 0 until sources.length()) {\n            val remote = sources.optJSONObject(i) ?: continue\n            val providerId\
        \ = str(remote, \"provider_id\", \"id\")\n            val url = str(remote, \"url\", \"server_url\", \"xtream_url\"\
        , \"playlist_url\").trimEnd('/')\n            val user = str(remote, \"username\", \"provider_username\")\n      \
        \      if (providerId.isBlank() || url.isBlank()) continue\n            val matches = locals.filter { local ->\n \
        \               local.url.trim().trimEnd('/') == url && local.username.orEmpty() == user\n            }\n        \
        \    // Ambiguity is unsafe; don't guess which provider owns somebody's viewing records.\n            if (matches.size\
        \ == 1) out[matches.first().id] = providerId\n        }\n        return out\n    }\n\n    private fun stableKey(record:\
