name: MovioXP Catalogue APK

on:
  workflow_dispatch:
  push:
    branches: [MovioXP, fix/movioxp-verifyerror-agp941]
    paths:
      - app/src/main/java/tv/own/owntv/features/home/**
      - app/src/main/java/tv/own/owntv/features/setup/**
      - app/src/main/java/tv/own/owntv/features/settings/BackupScreen.kt
      - app/src/main/java/tv/own/owntv/features/settings/BackupViewModel.kt
      - app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt
      - app/src/main/res/values/strings_moviotv.xml
      - tools/i18n/safe_literals.txt
      - app/build.gradle.kts
      - gradle/libs.versions.toml
      - .github/workflows/movioxp-catalogue-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MovioXP
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare MovioXP release keystore
        env:
          MOVIOXP_KEYSTORE_BASE64: ${{ secrets.MOVIOXP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$MOVIOXP_KEYSTORE_BASE64" ]]; then
            echo "Missing repository secret: MOVIOXP_KEYSTORE_BASE64"
            exit 1
          fi
          printf "%s" "$MOVIOXP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/movioxp-release.p12"
          test -s "$RUNNER_TEMP/movioxp-release.p12"

      - name: Build standard Android TV debug and signed release APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/movioxp-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.MOVIOXP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOVIOXP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOVIOXP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing one or more MovioXP signing secrets"
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardDebug :app:assembleStandardRelease --stacktrace

      - name: Verify signed release APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/standard/release -maxdepth 1 -type f -name "*.apk")
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "Expected exactly one release APK; found ${#apks[@]}"
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ ! -x "$apksigner" ]]; then echo "Android apksigner not found"; exit 1; fi
          "$apksigner" verify --verbose --print-certs "${apks[0]}"

      - name: Upload MovioXP debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MovioXP-v1.0.${{ github.run_number }}-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload MovioXP signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: MovioXP-v1.0.${{ github.run_number }}-signed-release-apk
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
          retention-days: 14
