name: MovioXP Catalogue APK

on:
  workflow_dispatch:
  push:
    branches: [MovioXP, fix/movioxp-verifyerror-agp941, fix/movioxp-verifyerror-shell-split, fix/movioxp-ui-cleanup-68, feature/movioxp-v71-resume-central, fix/movioxp-v73-shell-verifier]
    paths:
      - app/src/main/java/tv/own/owntv/features/home/**
      - app/src/main/java/tv/own/owntv/features/setup/**
      - app/src/main/java/tv/own/owntv/features/settings/BackupScreen.kt
      - app/src/main/java/tv/own/owntv/features/settings/BackupViewModel.kt
      - app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt
      - app/src/main/java/tv/own/owntv/features/shell/MovioXpPlaybackSupport.kt
      - app/src/main/java/tv/own/owntv/features/shell/MovioXpSectionRoute.kt
      - app/src/main/java/tv/own/owntv/features/setup/WizardFrame.kt
      - app/src/main/java/tv/own/owntv/features/home/MovioLandingScreen.kt
      - app/src/main/java/tv/own/owntv/features/home/XpCentralDataSync.kt
      - app/src/main/java/tv/own/owntv/features/home/XpCentralAddons.kt
      - app/src/main/res/values/strings_moviotv.xml
      - tools/i18n/safe_literals.txt
      - app/build.gradle.kts
      - gradle/libs.versions.toml
      - .github/workflows/movioxp-catalogue-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MovioXP
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build standard Android TV debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardDebug --stacktrace

      - name: Upload MovioXP APK
        uses: actions/upload-artifact@v7
        with:
          name: MovioXP-v1.0.${{ github.run_number }}-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
