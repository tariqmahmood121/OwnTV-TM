      - name: Apply V7.11 responsive UI startup and diagnostics changes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/moviotv_v711_delta.py <<'PYTHON_V711'
          from pathlib import Path
          import importlib.util
          
          ROOT = Path('.')
          
          def patch(filename, old, new, n=1):
              p = Path(filename)
              assert p.is_file(), f'V7.11 missing source file: {filename}'
              s = p.read_text(encoding='utf-8')
              got = s.count(old)
              assert got == n, f'V7.11 guard failed for {filename}: wanted {n}, found {got} for {old[:90]!r}'
              p.write_text(s.replace(old,new), encoding='utf-8')
          
          def create(filename, content):
              p = Path(filename)
              assert not p.exists(), f'V7.11 refusing overwrite of {filename}'
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')
          
          # Preserve the V7.10 pagination and DB/index strategy. Change only the QA application suffix.
          patch('app/build.gradle.kts', 'applicationIdSuffix = ".v710qa"', 'applicationIdSuffix = ".v711qa"')
          
          # --------- Cinematic splash: trigger when SYSTEM splash EXIT really occurs. ---------
          main = 'app/src/main/java/tv/own/owntv/MainActivity.kt'
          patch(main, '''    @Volatile
              private var startupSettled = false''', '''    @Volatile
              private var startupSettled = false
          
              // A separate Compose state triggered only after the Android splash is exiting.
              // It is NOT tied to the shell's startup callback: PIN/profile gates may settle first.
              private var movioIntroVisible by mutableStateOf(false)''')
          patch(main, '''        val splash = installSplashScreen()
                  super.onCreate(savedInstanceState)''', '''        val splash = installSplashScreen()
                  super.onCreate(savedInstanceState)
                  // Android's splash is a separate window. An intro timer started before its EXIT
                  // will expire invisibly on slow devices or on the first-run setup gate.
                  splash.setOnExitAnimationListener { exit ->
                      if (savedInstanceState == null && !isFinishing) {
                          movioIntroVisible = true
                          exit.view.animate().alpha(0f).setDuration(180L)
                              .withEndAction { exit.remove() }.start()
                      } else exit.remove()
                  }''')
          patch(main, '''            var showMovioIntro by remember { mutableStateOf(false) }
                      LaunchedEffect(showMovioIntro) {
                          if (showMovioIntro) {
                              kotlinx.coroutines.delay(850)
                              showMovioIntro = false
                          }
                      }''', '''            LaunchedEffect(movioIntroVisible) {
                          if (movioIntroVisible) {
                              kotlinx.coroutines.delay(2_200)
                              movioIntroVisible = false
                          }
                      }''')
          patch(main, '''                                onStartupSettled = {
                                              if (!startupSettled) {
                                                  startupSettled = true
                                                  showMovioIntro = true
                                              }
                                          },''', '''                                onStartupSettled = { startupSettled = true },''')
          patch(main, '''if (showMovioIntro) tv.own.owntv.features.settings.MovioIntroOverlay()''', '''if (movioIntroVisible) tv.own.owntv.features.settings.MovioIntroOverlay()''')
          
          # --------- Wizard: narrow phone viewport should scroll and never cut off key actions. ---------
          wf='app/src/main/java/tv/own/owntv/features/setup/WizardFrame.kt'
          patch(wf, '''        // The OwnTV lockup: the play mark on its cream tile, the name beside it.''', '''        val compact = maxWidth < 700.mpx
                  // The OwnTV lockup: the play mark on its cream tile, the name beside it.''')
          patch(wf, '''Modifier.padding(start = 64.mpx, top = 56.mpx),''', '''Modifier.padding(start = if (compact) 18.mpx else 64.mpx, top = if (compact) 16.mpx else 56.mpx),''')
          patch(wf, '''modifier = Modifier.size(44.mpx),''', '''modifier = Modifier.size(if (compact) 34.mpx else 44.mpx),''')
          patch(wf, '''style = stageText(24, 800), color = StageColors.Text, maxLines''', '''style = stageText(if (compact) 19 else 24, 800), color = StageColors.Text, maxLines''')
          patch(wf, '''        StepDots(step, Modifier.align(Alignment.TopEnd).padding(end = 64.mpx, top = 66.mpx))''', '''        if (!compact) StepDots(step, Modifier.align(Alignment.TopEnd).padding(end = 64.mpx, top = 66.mpx))''')
          patch(wf, '''                .padding(top = 170.mpx, bottom = 120.mpx)
                          .width(width.coerceAtMost(maxWidth - 128.mpx))
                          .heightIn(max = maxHeight - 290.mpx)
                          .stageGlass(32.mpx)''', '''                .padding(top = if (compact) 86.mpx else 170.mpx,
                              bottom = if (compact) 12.mpx else 120.mpx)
                          .width(if (compact) maxWidth - 20.mpx else width.coerceAtMost(maxWidth - 128.mpx))
                          .heightIn(max = if (compact) maxHeight - 100.mpx else maxHeight - 290.mpx)
                          .stageGlass(if (compact) 20.mpx else 32.mpx)''')
          patch(wf, '''                .padding(horizontal = 48.mpx, vertical = 44.mpx),''', '''                .padding(horizontal = if (compact) 16.mpx else 48.mpx,
                              vertical = if (compact) 18.mpx else 44.mpx),''')
