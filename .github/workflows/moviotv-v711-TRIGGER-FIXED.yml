# MovioTV V7.11: single-file build, preserving the V7.9 branch and installed app.
# Upload moviotv-v711-TRIGGER-FIXED.yml to .github/workflows/ of the V7.9 source branch.
# The push triggers one GitHub Actions run; no editing code or databases on your phone.
name: MovioTV V7.11 - TRIGGER-FIXED Responsive Profiles
'on':
  push:
    branches: [feature/moviotv-v79-oak-tablet-focus]
    paths: [.github/workflows/moviotv-v711-TRIGGER-FIXED.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moviotv-v711-trigger-fixed
  cancel-in-progress: false
jobs:
  build-v711:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION_CODE: '100018'
      VERSION_NAME: '7.11'
    steps:
      - name: Checkout protected V7.9 source into temporary runner
        uses: actions/checkout@v4
        with:
          ref: feature/moviotv-v79-oak-tablet-focus
          persist-credentials: false
      - name: Reapply proven V7.10 stability baseline in CI checkout
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/moviotv_v710_patch.py <<'PYTHON_V710'
          from pathlib import Path
          import base64
          
          def patch(filename, old, new, count=1):
              path = Path(filename)
              assert path.is_file(), f'Expected file missing: {filename}'
              s = path.read_text(encoding='utf-8')
              n = s.count(old)
              assert n == count, f'V7.10 patch guard failed: {filename}; found {n}, expected {count}, token {old[:80]!r}'
              path.write_text(s.replace(old, new), encoding='utf-8')
          
          def create(filename, contents):
              path=Path(filename)
              assert not path.exists(), f'Refusing to overwrite: {filename}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(contents, encoding='utf-8')
          
          # V7.10 deliberately keeps Room's existing source/category/sort indexes. No schema reset.
          vm='app/src/main/java/tv/own/owntv/features/movies/MovieViewModel.kt'
          movies='app/src/main/java/tv/own/owntv/features/movies/MoviesScreen.kt'
          patch(vm, 'Pager(PagingConfig(pageSize = 60, prefetchDistance = 30, initialLoadSize = 90, maxSize = 300))',
                    'Pager(PagingConfig(pageSize = 24, prefetchDistance = 12, initialLoadSize = 48, maxSize = 144))')
          patch(vm, 'fun onPosterlessVisible(movies: List<MovieEntity>) { _posterProbe.value = movies }', '''fun onPosterlessVisible(movies: List<MovieEntity>) {
                  // Only inspect the posters actually visible or about to enter the screen.
                  _posterProbe.value = movies.take(30)
              }
          
              /** Forget poster lookup results when leaving Movies. Never retain a whole catalogue. */
              fun onBrowseScreenClosed() {
                  _posterProbe.value = emptyList()
                  _cachedPosters.value = emptyMap()
              }''')
          patch(vm, 'if (resolvedMeta.size > 500) resolvedMeta.clear()', 'if (resolvedMeta.size > 160) resolvedMeta.clear()')
          patch(vm, 'val base = if (_cachedPosters.value.size > 500) emptyMap() else _cachedPosters.value',
                    'val base = if (_cachedPosters.value.size > 120) emptyMap() else _cachedPosters.value')
          patch(vm, '''        if (remember) categoryMemory.picked(key)
                  _selected.value = key
                  // Core's lazy-catalogue drain''', '''        if (remember) categoryMemory.picked(key)
                  if (_selected.value != key) {
                      // Prevent stale focus and pending poster requests when going from a 1-item
                      // category to a 138k-item All Movies catalogue.
                      _selectedMovie.value = null
                      _posterProbe.value = emptyList()
                      _cachedPosters.value = emptyMap()
                  }
                  _selected.value = key
                  // Core's lazy-catalogue drain''')
          patch(movies, '    val vm: MovieViewModel = koinViewModel()\n', '''    val vm: MovieViewModel = koinViewModel()
              DisposableEffect(vm) {
                  onDispose { vm.onBrowseScreenClosed() }
              }
          ''')
          
          # New debug build is installed separately from working V7.9. Release ID stays original.
          patch('app/build.gradle.kts', '''        debug {
                      // V7.9+: stable application ID for update-in-place.''',
                '''        debug {
                      // Safe standalone QA install; never overwrite V7.9 with an unrelated debug key.
                      applicationIdSuffix = ".v710qa"
                      // V7.9+: stable application ID for update-in-place.''')
          
          # Artwork supplied as base64 by the enclosing GitHub Actions workflow.
          art=Path('app/src/main/res/drawable-nodpi/moviotv_v710_intro.jpg')
