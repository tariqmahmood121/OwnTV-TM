          # --------- Default, rolling, user-shareable diagnostic breadcrumbs. ---------
          rolling='app/src/main/java/tv/own/owntv/MovioRollingDebug.kt'
          create(rolling, '''package tv.own.owntv
          
          import android.content.Context
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.launch
          
          /** Bounded private diagnostic breadcrumbs. Never records URLs, credentials or content names.
           * Keeps the latest 128KiB, overwriting old lines automatically; never needs user opt-in to record.
           * Only shares when the user explicitly presses Share debug log in Settings > More > Error log.
           */
          object MovioRollingDebug {
              private const val FILE = "moviotv-rolling-debug.txt"
              private const val LIMIT = 128 * 1024
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private val lock = Any()
          
              fun record(context: Context, event: String) {
                  // Caller must pass a bounded, code-authored event label, never a URL or exception message.
                  scope.launch { write(context.applicationContext, event) }
              }
          
              private fun write(context: Context, event: String) = synchronized(lock) {
                  try {
                      val file = File(context.filesDir, FILE)
                      val date = SimpleDateFormat("yyyy-MM-dd HH:mm:ss.SSS", Locale.US).format(Date())
                      val line = "$date | ${event.take(if (event.startsWith("STACK ")) 3600 else 160)}\\n"
                      val previous = if (file.exists()) file.readText(Charsets.UTF_8) else ""
                      // Preserve complete lines; older records automatically roll off.
                      val combined = previous + line
                      val trimmed = if (combined.length > LIMIT) {
                          val start = combined.length - LIMIT
                          combined.substring(combined.indexOf('\\n', start).takeIf { it >= 0 }?.plus(1) ?: start)
                      } else combined
                      file.writeText(trimmed, Charsets.UTF_8)
                  } catch (_: Exception) { /* Diagnostics must never break playback. */ }
              }
          
              fun install(context: Context) {
                  val app = context.applicationContext
                  record(app, "application-start")
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      try {
                          // No Throwable.message: those sometimes contain a credential-bearing stream URL.
                          val shortTrace = error.stackTrace.take(24).joinToString(" | ") {
                              it.className + "." + it.methodName + ":" + it.lineNumber
                          }
                          write(app, "FATAL " + error.javaClass.name + " thread=" + thread.name.take(35))
                          write(app, "STACK " + shortTrace.take(3000))
                      } catch (_: Throwable) { /* A failing reporter must never block the existing crash handler. */ }
                      if (previous != null) previous.uncaughtException(thread, error)
                      else android.os.Process.killProcess(android.os.Process.myPid())
                  }
              }
          
              fun exportFile(context: Context): File = synchronized(lock) {
                  File(context.cacheDir, "moviotv-diagnostic-log.txt").apply {
                      writeText(snapshot(context), Charsets.UTF_8)
                  }
              }
          
              fun snapshot(context: Context): String = synchronized(lock) {
                  runCatching { File(context.filesDir, FILE).takeIf { it.isFile }?.readText(Charsets.UTF_8).orEmpty() }
                      .getOrDefault("")
              }
          }
          ''')
