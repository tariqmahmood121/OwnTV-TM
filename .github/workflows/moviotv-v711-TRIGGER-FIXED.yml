          if [[ -n "$KEY_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/movio-existing-signing.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Existing signing key unavailable; no in-place upgrade will be produced."
          fi
