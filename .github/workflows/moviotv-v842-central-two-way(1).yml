        \ in current.items():\n    baseline_count=baseline.get(key,0)\n    safe_count=entries.get(key,(0,'technical'))[0]\n    excess=count-baseline_count-safe_count\n\
        \    if excess>0:\n        if key[0] not in allow: raise RuntimeError('Unclassified new literal: '+str(key))\n        entries[key]=(safe_count+excess,categories.get(key,'technical'))\n\
        assert all(n<=current.get(k,0) for k,(n,_) in entries.items())\nmod.SAFE_MANIFEST.write_text(mod._serialize_safe(entries),encoding='utf8')\n\
        subprocess.run([sys.executable,str(scanner),'verify','--bootstrap'],check=True,cwd=ROOT)\nassert 'MovioCentralTwoWaySync.kick'  in cloud.read_text()\n\
        assert 'moviotv_central_sync_now' in screen.read_text()\nassert 'expected_version' in api.read_text()\nassert 'exportTombstones' in sync_kt\
        \ and 'applyTombstones' in sync_kt\nprint('V8.4.2 preflight: API PUT, source mapping, merge, tombstones, offline retention, sync UI and\
        \ worker installed')\nV842_PATCH\npython3 -m py_compile /tmp/moviotv-v842-sync-patch.py\npython3 /tmp/moviotv-v842-sync-patch.py\n"
    - name: Java 25 for the Android toolchain
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Reuse Gradle dependencies and task outputs
      uses: gradle/actions/setup-gradle@v4
    - name: Compile quickly or fully validate and assemble debug APK
      shell: bash
      env:
        BUILD_MODE: ${{ inputs.build_mode || 'full' }}
      run: "set -euo pipefail\nchmod +x ./gradlew\nif [[ \"$BUILD_MODE\" == fast ]]; then\n  ./gradlew -Powntv.corePath=\"$GITHUB_WORKSPACE/moviotv-core\"\
        \ :app:compileStandardDebugKotlin --no-daemon --stacktrace\nelse\n  ./gradlew -Powntv.corePath=\"$GITHUB_WORKSPACE/moviotv-core\" lintStandardDebug\
        \ testStandardDebugUnitTest assembleStandardDebug --no-daemon --stacktrace\nfi\n"
    - name: Verify APK package, version and signature
      if: ${{ github.event_name == 'push' || inputs.build_mode == 'full' }}
      shell: bash
      run: 'set -euo pipefail

        src=app/build/outputs/apk/standard/debug/app-standard-debug.apk

        test -s "$src"

        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

        aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -n 1)"

        signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

        test -x "$aapt" && test -x "$signer"

        "$signer" verify "$src"

        "$aapt" dump badging "$src" > /tmp/moviotv-v842-badging.txt

        grep -F "name=''com.oakstudios.moviotv''" /tmp/moviotv-v842-badging.txt

        grep -F "versionCode=''100106''" /tmp/moviotv-v842-badging.txt

        grep -F "versionName=''8.4.2''" /tmp/moviotv-v842-badging.txt

        mkdir -p dist

        cp "$src" dist/MovioTV-v8.4.2-TWO-WAY-SYNC-QA-debug.apk

        '
    - name: Upload installable QA APK
      if: ${{ github.event_name == 'push' || inputs.build_mode == 'full' }}
      uses: actions/upload-artifact@v4
      with:
        name: MovioTV-V8.4.2-TWO-WAY-SYNC-QA-DEBUG
        path: dist/MovioTV-v8.4.2-TWO-WAY-SYNC-QA-debug.apk
        retention-days: 30
        if-no-files-found: error
    - name: Capture reports on failed checks
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: MovioTV-V8.4.2-BUILD-DIAGNOSTICS
        path: 'app/build/reports/tests/**

          app/build/reports/lint-results-*.html

          app/build/reports/lint-results-*.txt

          build/reports/problems/**'
        retention-days: 30
        if-no-files-found: warn
