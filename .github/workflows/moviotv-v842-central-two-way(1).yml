        \ ignoreCase = true)\n        }\n\n    private fun authorizedSourceMapping(sources: JSONArray, locals: List<SourceEntity>): Map<Long,\
        \ String> {\n        val out = mutableMapOf<Long, String>()\n        for (i in 0 until sources.length()) {\n            val remote = sources.optJSONObject(i)\
        \ ?: continue\n            val providerId = str(remote, \"provider_id\", \"id\")\n            val url = str(remote, \"url\", \"server_url\"\
        , \"xtream_url\", \"playlist_url\").trimEnd('/')\n            val user = str(remote, \"username\", \"provider_username\")\n          \
        \  if (providerId.isBlank() || url.isBlank()) continue\n            val matches = locals.filter { local ->\n                local.url.trim().trimEnd('/')\
