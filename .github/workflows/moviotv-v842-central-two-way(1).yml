name: MovioTV V8.4.2 - Permanent Fast Check or Full APK
run-name: MovioTV V8.4.2 ${{ inputs.build_mode || 'full' }} - ${{ github.ref_name }} - ${{ github.run_number }}
'on':
  push:
    branches:
    - feature/moviotv-v8-stability
    paths:
    - .github/workflows/moviotv-v842-central-two-way.yml
  workflow_dispatch:
    inputs:
      build_mode:
        description: Fast Kotlin compile check or full tested APK
        required: true
        type: choice
        default: full
        options:
        - fast
        - full
permissions:
  contents: read
concurrency:
  group: moviotv-v842-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  v842-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      VERSION_NAME: 8.4.2
      VERSION_CODE: '100106'
    steps:
    - name: Checkout MovioTV stable development branch (read only)
      uses: actions/checkout@v4
      with:
        ref: feature/moviotv-v8-stability
        fetch-depth: 0
    - name: Checkout pinned upstream Core 1.0.71
      uses: actions/checkout@v4
      with:
        repository: ahXN00/OwnTV_Core
        ref: 0b60ef6d25e03a24193f1a5680cb239816fd8625
        path: moviotv-core
        persist-credentials: false
    - name: Checkout verified V8.1 Core patch
      uses: actions/checkout@v4
      with:
        repository: tariqmahmood121/OwnTV-TM
        ref: feature/moviotv-v81-stability
        path: moviotv-v81-verified
        persist-credentials: false
    - name: Replay exact successful V8.4.1 source and checks
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''V841_BASE''

        from pathlib import Path

        import textwrap

        import subprocess

        workflow=Path(''.github/workflows/moviotv-v841-cloud-first-one-file-FIX5.yml'')

        assert workflow.is_file(), ''V8.4.1 successful source workflow missing''

        lines=workflow.read_text(encoding=''utf8'').splitlines(keepends=True)

        marker=''      - name: Replay verified V8.4.1 recipe with targeted lint correction\n''

        assert lines.count(marker)==1, ''V8.4.1 source recipe changed''

        start=lines.index(marker)+1

        stop=next(i for i in range(start,len(lines)) if lines[i].startswith(''      - name: ''))

        run=next(i for i in range(start,stop) if lines[i]==''        run: |\n'')

        script=textwrap.dedent(''''.join(lines[run+1:stop]))

        assert ''Fix'' not in script[:60] or len(script)>100, ''Invalid recipe''

        subprocess.run([''bash'',''-e'',''-u'',''-o'',''pipefail'',''-c'',script],check=True)

        V841_BASE'
    - name: Apply Central two-way sync and preflight source validation
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/moviotv-v842-sync-patch.py <<'V842_PATCH'\n#!/usr/bin/env python3\n\"\"\"Apply targeted V8.4.2 Central\
        \ two-way sync on a freshly replayed V8.4.1 build tree.\"\"\"\nfrom pathlib import Path\nimport re\nimport xml.etree.ElementTree as ET\n\
        ROOT=Path.cwd()\nBASE=ROOT/'app/src/main/java/tv/own/owntv'\napi=BASE/'features/central/MovioCentralApi.kt'\nmain=BASE/'MainActivity.kt'\n\
        cloud=BASE/'features/setup/MovioCloudFirstRun.kt'\nscreen=BASE/'features/central/MovioCentralScreen.kt'\nassert all(p.is_file() for p\
        \ in (api,main,cloud,screen)), 'Base V8.4.1 not present'\n\ndef once(path,old,new):\n    s=path.read_text(encoding='utf8')\n    assert\
        \ s.count(old)==1, f'Unexpected source change at {path}: {old[:100]!r}: count={s.count(old)}'\n    path.write_text(s.replace(old,new),encoding='utf8')\n\
        \nonce(api, '              suspend fun profileSources(profileId: Long): JSONObject = withContext(Dispatchers.IO) {', '''             \
        \ /** The Central service has ownership checks and optimistic versioning. */\n              fun hasCloudSession(): Boolean = token() !=\
        \ null\n              suspend fun putSyncRecord(profileId: Long, recordType: String, key: String,\n                                  \
        \      payload: JSONObject, expectedVersion: Int?): JSONObject = withContext(Dispatchers.IO) {\n                  require(profileId >\
        \ 0 && recordType in setOf(\"favorite\", \"history\", \"resume\"))\n                  require(key.length in 5..190)\n                \
        \  val body = JSONObject().put(\"profile_id\", profileId)\n                      .put(\"record_type\", recordType).put(\"record_key\"\
        , key).put(\"payload\", payload)\n                  if (expectedVersion != null && expectedVersion > 0) body.put(\"expected_version\"\
        , expectedVersion)\n                  call(\"sync\", \"PUT\", body, requiresAuth = true)\n              }\n              suspend fun profileSources(profileId:\
        \ Long): JSONObject = withContext(Dispatchers.IO) {''')\n\nsync_kt=r'''package tv.own.owntv.features.central\n\nimport android.content.Context\n\
        import androidx.work.CoroutineWorker\nimport androidx.work.ExistingPeriodicWorkPolicy\nimport androidx.work.ExistingWorkPolicy\nimport\
        \ androidx.work.OneTimeWorkRequestBuilder\nimport androidx.work.PeriodicWorkRequestBuilder\nimport androidx.work.WorkManager\nimport androidx.work.WorkerParameters\n\
        import kotlinx.coroutines.sync.Mutex\nimport org.json.JSONArray\nimport org.json.JSONObject\nimport org.koin.core.context.GlobalContext\n\
        import tv.own.owntv.core.backup.UserDataResolver\nimport tv.own.owntv.core.database.dao.ProfileDao\nimport tv.own.owntv.core.database.dao.SourceDao\n\
        import tv.own.owntv.core.database.entity.SourceEntity\nimport java.io.IOException\nimport java.security.MessageDigest\nimport java.util.concurrent.TimeUnit\n\
        \n/** Profile-scoped, fail-closed sync of local favourites/history/resume with Central's versioned API.\n * Local Room data is the durable\
