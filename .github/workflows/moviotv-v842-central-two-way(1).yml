        \            val previous = output[\"${row.type}|${row.key}\"]\n            if (previous == null || timestamp > previous.timestamp) output[\"\
        ${row.type}|${row.key}\"] = row\n        }\n    }\n\n    private data class RemoteRecord(val version: Int, val timestamp: Long)\n\n  \
        \  /** Parse Cloud rows strictly against THIS profile's provider map. Unsupported records are skipped. */\n    private suspend fun mergeRemote(records:\
